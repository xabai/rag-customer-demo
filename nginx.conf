# ====================================================================
# Nginx 反代配置（生产推荐入口）
# 单一网关：SPA 静态 + /api 反代后端 + SSE 流式支持
# ====================================================================
server {
    listen 80;
    server_name _;

    # ---------- 前端 SPA ----------
    # index.html 用 try_files 兜底，Vue Router history 模式不炸
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源强缓存（带 hash 的文件名）
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ---------- 健康检查 ----------
    location /health {
        proxy_pass http://backend:8008/health;
    }

    # ---------- API 反代 ----------
    location /api/ {
        proxy_pass http://backend:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 常规 API 超时
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 10s;
    }

    # ---------- SSE 流式（/api/chat 返回 StreamingResponse）----------
    # SSE 必须关 gzip + 加 buffering off + 长 timeout
    location /api/chat {
        proxy_pass http://backend:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 关键配置
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        gzip off;                    # SSE 不能 gzip，客户端等不到完整包
        proxy_read_timeout 600s;     # LLM 流式可能持续几分钟
        proxy_send_timeout 600s;
    }

    # ---------- 静态文件（后端 /static 挂载的）----------
    location /static/ {
        proxy_pass http://backend:8008;
        # 后端 serve 的静态资源也可以 Nginx 直接 serve 更快
        # 如果用多阶段构建把 static/ 复制到 Nginx，这里改成 alias 就行
    }

    # ---------- /kb_images 上传图片 ----------
    location /kb_images/ {
        proxy_pass http://backend:8008;
    }
}
