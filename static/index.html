<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG AI 客服</title>
<style>
  /* ========== 浅色 SaaS 主题变量 ========== */
  :root {
    --bg: #f5f7fa;
    --bg-soft: #f1f5f9;
    --card: #ffffff;
    --card-solid: #ffffff;
    --border: #e2e8f0;
    --text-h: #0f172a;
    --text: #334155;
    --text-sub: #64748b;
    --text-dim: #94a3b8;
    --accent: #0ea5e9;
    --accent2: #2563eb;
    --accent-soft: rgba(14,165,233,.1);
    --green: #059669;
    --red: #ef4444;
    --orange: #d97706;
    --card-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; height: 100vh; background: var(--bg); color: var(--text); overflow: hidden; }
  /* Vue 挂载点：顶栏 + 主区垂直布局 */
  #app { display: flex; flex-direction: column; height: 100vh; }
  /* 全局滚动条 */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  select, input, textarea { color-scheme: light; }

  /* ========== 顶部横向导航栏 ========== */
  #navbar { height: 56px; flex-shrink: 0; background: var(--card); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 20px; gap: 24px; box-shadow: var(--card-shadow); position: relative; z-index: 10; }
  #navbar .navbar-logo { font-size: 16px; font-weight: 800; color: var(--text-h); letter-spacing: .5px; white-space: nowrap; }
  #navbar .navbar-nav { display: flex; gap: 4px; flex: 1; }
  #navbar .nav-item { display: flex; align-items: center; gap: 6px; padding: 8px 16px; background: transparent; color: var(--text-sub);
    border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all .15s; white-space: nowrap; }
  #navbar .nav-item:hover { background: var(--bg-soft); color: var(--text-h); }
  #navbar .nav-item.active { background: linear-gradient(135deg, rgba(14,165,233,.12), rgba(37,99,235,.10)); color: var(--accent); font-weight: 600; }
  #navbar .navbar-right { display: flex; align-items: center; gap: 12px; }

  /* ========== 主区公共 ========== */
  #main { flex: 1; display: flex; min-width: 0; min-height: 0; }
  .main-view { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }

  /* ========== 对话视图（左侧会话面板 + 右侧主区） ========== */
  #chat-layout { display: flex; flex: 1; min-height: 0; }
  #session-panel { width: 260px; flex-shrink: 0; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #new-chat { margin: 14px; padding: 10px; background: linear-gradient(135deg, #0ea5e9, #2563eb); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; letter-spacing: 1px; transition: all .15s; }
  #new-chat:hover { box-shadow: 0 4px 12px rgba(14,165,233,.3); transform: translateY(-1px); }
  #session-list { flex: 1; overflow-y: auto; padding: 0 10px 12px; }
  .session-item { padding: 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin-bottom: 4px; color: var(--text); border: 1px solid transparent; transition: all .15s; }
  .session-item:hover { background: var(--bg-soft); }
  .session-item.active { background: rgba(14,165,233,.08); color: var(--text-h); border-color: rgba(14,165,233,.25); }
  .session-item .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .del { visibility: hidden; color: var(--text-dim); padding: 0 4px; }
  .session-item:hover .del { visibility: visible; }
  .session-item .del:hover { color: var(--red); }

  #chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 24px; background: var(--card); border-bottom: 1px solid var(--border); }
  #topbar-title { font-size: 14px; font-weight: 600; color: var(--text-h); letter-spacing: .5px; }
  #topbar-right { display: flex; align-items: center; gap: 16px; }
  #upload-kb, #rt-kb, #rt-topk, #ir-action { border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 13px; outline: none; background: var(--card); color: var(--text); cursor: pointer; }
  #upload-kb:focus { border-color: var(--accent); }

  #chat-box { flex: 1; overflow-y: auto; padding: 24px; background: var(--bg); }
  .msg { max-width: 75%; margin-bottom: 16px; padding: 12px 16px; border-radius: 12px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; font-size: 15px; animation: msgIn .22s ease; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user { margin-left: auto; background: linear-gradient(135deg, #0ea5e9, #2563eb); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant { margin-right: auto; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; color: var(--text); }
  .msg .sources { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--text-sub); }
  /* 引用芯片（可点击跳转分块） */
  .src-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; margin: 2px 4px 2px 0; background: var(--accent-soft); color: var(--accent); border-radius: 12px; cursor: pointer; font-size: 12px; transition: all .15s; }
  .src-chip:hover { background: var(--accent); color: #fff; transform: translateY(-1px); }
  .src-chip i { font-style: normal; font-size: 11px; opacity: .75; }
  /* 相关图片卡片区 —— 答案和参考来源之间 */
  .ans-images { margin: 14px 0 10px; padding: 10px 12px; background: linear-gradient(135deg, rgba(99,102,241,.06), rgba(14,165,233,.04)); border: 1px solid rgba(99,102,241,.15); border-radius: 12px; }
  .ans-images-title { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 8px; letter-spacing: .5px; }
  .ans-images-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .ans-img-card { background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); transition: transform .15s, box-shadow .15s; cursor: pointer; }
  .ans-img-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.1); }
  .ans-img { width: 180px; height: 120px; object-fit: cover; display: block; background: #f1f5f9; }
  .ans-img-footer { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px; gap: 8px; }
  .ans-img-src { font-size: 11px; color: var(--text-sub); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ans-img-score { font-size: 11px; color: var(--accent); font-weight: 600; white-space: nowrap; }
  /* 阶段提示（检索/生成中） */
  .stage-tip { margin-top: 8px; font-size: 13px; color: var(--accent); display: flex; align-items: center; gap: 6px; }
  .stage-tip::before { content: ''; width: 14px; height: 14px; border: 2px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  .stage-time { font-size: 12px; opacity: 0.7; font-weight: normal; }
  .msg-time { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--text-sub); }
  .trace-link { color: var(--accent); cursor: pointer; margin-left: 8px; }
  .trace-link:hover { text-decoration: underline; }
  /* 链路追踪详情 */
  .trace-stage { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
  .trace-stage-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .trace-stage-icon { font-size: 14px; }
  .trace-stage-name { font-weight: 600; flex: 1; }
  .trace-stage-time { font-family: Consolas, monospace; color: var(--accent); font-weight: 600; }
  .trace-stage-row { display: flex; gap: 8px; font-size: 12px; margin-top: 4px; }
  .trace-stage-label { color: var(--text-dim); min-width: 40px; }
  .trace-stage-val { color: var(--text); word-break: break-all; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg .msg-imgs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .msg .msg-imgs img { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
  #welcome { text-align: center; color: var(--text-dim); margin-top: 18vh; font-size: 15px; }
  #welcome .big { font-size: 44px; margin-bottom: 12px; }
  .welcome-title { font-size: 26px; font-weight: 700; color: var(--text-h); margin-bottom: 10px; letter-spacing: .5px; }
  .welcome-sub { font-size: 14px; color: var(--text-dim); }
  .topbar-hint { font-size: 12px; color: var(--text-dim); background: var(--bg-soft); padding: 5px 12px; border-radius: 14px; }
  /* 回答下方的追问建议 */
  .sugg-follow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .sugg-follow-label { font-size: 12px; color: var(--text-dim); align-self: center; }
  .sugg-follow .sugg-chip { padding: 5px 12px; background: var(--surface-2, #f1f5f9); border: 1px solid var(--border); border-radius: 14px; font-size: 13px; color: var(--text-sub); cursor: pointer; transition: all .15s; }
  .sugg-follow .sugg-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  .typing { display: inline-flex; gap: 5px; padding: 4px 0; }
  .typing span { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  .slow-tip { font-size: 12px; color: var(--text-dim); margin-top: 6px; }

  .msg-actions { display: flex; gap: 6px; margin-top: 8px; opacity: 0.6; }
  .msg:hover .msg-actions { opacity: 1; }
  .ma-btn { background: transparent; border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 13px; color: var(--text-sub); transition: all .15s; }
  .ma-btn:hover { background: rgba(14,165,233,.08); color: var(--accent); border-color: rgba(14,165,233,.3); }

  .tool-call { background: rgba(217,119,6,.1); color: var(--orange); border: 1px solid rgba(217,119,6,.25); font-size: 12px; padding: 6px 10px; border-radius: 6px; margin-bottom: 8px; font-family: Consolas, monospace; }

  /* 输入区：千问式圆角编辑器（文本框 + 内置工具栏） */
  #input-area { padding: 10px 24px 18px; background: var(--bg); }
  #composer { max-width: 900px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 12px 14px 8px; box-shadow: 0 2px 10px rgba(15,23,42,.04); transition: all .15s; }
  #composer:focus-within { border-color: var(--accent); box-shadow: 0 6px 20px rgba(14,165,233,.14); }
  #input { width: 100%; border: none; background: transparent; color: var(--text-h); padding: 2px 4px 8px; font-size: 15px; resize: none; outline: none; font-family: inherit; line-height: 1.6; }
  .composer-bar { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .cb-btn { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 10px; border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--text-sub); font-size: 13px; cursor: pointer; transition: all .15s; font-family: inherit; white-space: nowrap; }
  .cb-btn:hover { background: var(--bg-soft); color: var(--text-h); }
  .cb-btn.active { background: var(--accent-soft); color: var(--accent); }
  .cb-btn.cb-icon { width: 32px; padding: 0; justify-content: center; font-size: 17px; }
  .cb-caret { font-size: 10px; opacity: .55; }
  .cb-spacer { flex: 1; min-width: 8px; }
  .cb-send { width: 34px; height: 34px; border-radius: 50%; border: none; background: linear-gradient(135deg, #0ea5e9, #2563eb); color: #fff; font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all .15s; flex-shrink: 0; }
  .cb-send:hover { box-shadow: 0 4px 12px rgba(14,165,233,.35); transform: translateY(-1px); }
  .cb-send:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; transform: none; }
  .cb-send.stop { background: #ef4444; }
  .cb-menu-wrap { position: relative; }
  .cb-menu { position: absolute; bottom: 42px; left: 0; min-width: 250px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 32px rgba(15,23,42,.16); padding: 6px; z-index: 60; animation: msgIn .15s ease; }
  .cb-menu.right { left: auto; right: 0; }
  .cb-menu-title { font-size: 11px; color: var(--text-dim); padding: 6px 10px 4px; }
  .cb-menu-item { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px; font-size: 13px; color: var(--text); cursor: pointer; }
  .cb-menu-item:hover { background: var(--bg-soft); }
  .cb-menu-item .mi-icon { font-size: 15px; width: 18px; text-align: center; }
  .cb-menu-item .mi-sub { font-size: 11px; color: var(--text-dim); margin-left: auto; }
  #img-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  /* 图片大图预览灯箱 */
  .img-lightbox { position: fixed; inset: 0; z-index: 999; background: rgba(15,23,42,.85); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: zoom-out; backdrop-filter: blur(4px); }
  .img-lightbox-inner { max-width: 90vw; max-height: 85vh; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.4); background: #fff; }
  .img-lightbox-tip { color: rgba(255,255,255,.7); font-size: 12px; margin-top: 12px; }

  /* ========== 看板卡片 ========== */
  .dash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .dash-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; display: flex; align-items: center; gap: 14px; transition: all .18s; box-shadow: var(--card-shadow); }
  .dash-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(14,165,233,.12); }
  .dash-card .icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .dash-card .num { font-size: 26px; font-weight: 800; color: var(--text-h); line-height: 1.2; font-family: Consolas, monospace; }
  .dash-card .label { font-size: 13px; color: var(--text-sub); margin-top: 2px; }
  .dash-section-title { font-size: 15px; font-weight: 700; color: var(--text-h); margin: 28px 0 12px; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; }
  .dash-section-title::before { content: ''; width: 4px; height: 14px; border-radius: 2px; background: linear-gradient(180deg, var(--accent), var(--accent2)); }
  /* 看板二级子菜单布局 */
  .dash-page { display: flex; gap: 20px; padding: 24px 28px; }
  .dash-subnav { width: 180px; flex-shrink: 0; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px; box-shadow: var(--card-shadow); height: fit-content; position: sticky; top: 0; }
  .ds-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--text-sub); transition: all .15s; }
  .ds-item:hover { background: var(--bg-soft); color: var(--text-h); }
  .ds-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .ds-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); line-height: 1.8; }
  .dash-content { flex: 1; min-width: 0; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; box-shadow: var(--card-shadow); }
  .chart-title { font-size: 13px; font-weight: 600; color: var(--text-h); margin: 20px 0 10px; }
  .dash-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .seg { display: inline-flex; background: var(--bg-soft); border-radius: 8px; padding: 2px; }
  .seg button { padding: 6px 12px; border: none; background: transparent; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--text-sub); transition: all .15s; }
  .seg button.active { background: var(--card); color: var(--accent); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .empty-tip { color: var(--text-dim); font-size: 13px; text-align: center; padding: 20px 0; }
  .tag-good { background: rgba(34,197,94,.12); color: #16a34a; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
  .tag-bad { background: rgba(239,68,68,.12); color: #ef4444; padding: 2px 6px; border-radius: 4px; font-size: 11px; }

  /* ========== 设置页 ========== */
  .settings-page { display: flex; gap: 20px; padding: 24px 28px; }
  .settings-content { flex: 1; min-width: 0; }
  .settings-toolbar { position: sticky; top: 0; z-index: 10; background: var(--bg); display: flex; align-items: center; justify-content: space-between; padding: 12px 0; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .st-title { font-size: 18px; font-weight: 700; color: var(--text-h); }
  .st-actions { display: flex; gap: 10px; }
  .btn-ghost { background: var(--card); color: var(--text-sub); border: 1px solid var(--border); border-radius: 8px; padding: 8px 18px; cursor: pointer; font-size: 13px; transition: all .15s; }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: linear-gradient(135deg, #0ea5e9, #2563eb); color: #fff; border: none; border-radius: 8px; padding: 8px 22px; cursor: pointer; font-size: 13px; font-weight: 600; transition: opacity .15s; }
  .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
  /* 表单块 */
  .form-block { display: flex; flex-direction: column; gap: 10px; }
  .fb-label { font-size: 14px; font-weight: 600; color: var(--text-h); display: flex; align-items: center; gap: 8px; }
  .fb-tag { font-size: 11px; font-weight: 500; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 10px; }
  .fb-textarea { width: 100%; box-sizing: border-box; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.6; color: var(--text); outline: none; resize: vertical; font-family: inherit; transition: border-color .15s; }
  .fb-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(14,165,233,.1); }
  .fb-desc { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
  .fb-desc code { background: var(--bg-soft); padding: 1px 5px; border-radius: 3px; color: var(--accent); font-size: 11px; }
  /* 表单行（开关） */
  .form-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; }
  .fr-info { flex: 1; }
  .fr-name { font-size: 14px; font-weight: 600; color: var(--text-h); }
  .fr-desc { font-size: 12px; color: var(--text-sub); margin-top: 4px; line-height: 1.5; }
  .form-divider { height: 1px; background: var(--border); margin: 4px 0; }
  .form-sub { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); display: flex; gap: 24px; }
  .form-sub .range-block { flex: 1; }
  .form-sub .num-block { width: 140px; }
  /* Toggle 开关 */
  .toggle { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle .slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 24px; cursor: pointer; transition: background .2s; }
  .toggle .slider::before { content: ''; position: absolute; height: 18px; width: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .toggle input:checked + .slider { background: var(--accent); }
  .toggle input:checked + .slider::before { transform: translateX(20px); }
  /* 美化 range */
  .fb-range { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px; background: var(--bg-soft); outline: none; }
  .fb-range::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 1px 4px rgba(14,165,233,.35); border: 2px solid #fff; }
  .fb-range::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid #fff; }
  .range-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin-top: 6px; }
  .range-val { color: var(--accent); font-weight: 700; font-family: Consolas, monospace; }
  .fb-number { width: 100%; box-sizing: border-box; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; outline: none; background: var(--bg); color: var(--text); transition: border-color .15s; }
  .fb-number:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(14,165,233,.1); }

  /* ========== 弹窗 ========== */
  .modal-mask { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 420px; max-width: 92vw; box-shadow: 0 20px 50px rgba(0,0,0,.15); animation: modalIn .18s ease; }
  @keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: var(--text-h); }
  .modal .field { margin-bottom: 14px; }
  .modal .field label { display: block; font-size: 13px; color: var(--text); margin-bottom: 6px; font-weight: 500; }
  .modal .field input[type="text"] { width: 100%; border: 1px solid var(--border); background: var(--card); color: var(--text-h); border-radius: 8px; padding: 9px 12px; font-size: 14px; box-sizing: border-box; outline: none; }
  .modal .field input[type="text"]:focus { border-color: var(--accent); }
  .modal .field input[type="range"] { width: 100%; accent-color: var(--accent); }
  .modal .range-val { font-size: 12px; color: var(--accent); font-weight: 700; font-family: Consolas, monospace; }
  .modal .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .modal .btn-cancel { background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 13px; color: var(--text-sub); }
  .modal .btn-cancel:hover { border-color: var(--text-sub); color: var(--text); }
  .modal .btn-ok { background: linear-gradient(135deg, #0ea5e9, #2563eb); border: none; border-radius: 8px; padding: 8px 18px; cursor: pointer; font-size: 13px; color: #fff; font-weight: 600; transition: all .15s; }
  .modal .btn-ok:hover { box-shadow: 0 4px 12px rgba(14,165,233,.3); }
  .modal .btn-ok:disabled { opacity: .6; cursor: wait; box-shadow: none; }
  .upload-tab { padding: 8px 16px; cursor: pointer; font-size: 13px; border-bottom: 2px solid transparent; color: var(--text-sub); transition: all .15s; }
  .upload-tab.active { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }

  /* ========== 知识库管理视图（二级子菜单 + 内容区） ========== */
  #kb-view { overflow-y: auto; }
  .kb-layout { display: flex; flex: 1; min-height: 0; }
  .kb-subnav { width: 200px; flex-shrink: 0; background: var(--card); border-right: 1px solid var(--border); padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; }
  .kb-subnav-title { font-size: 12px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; padding: 0 10px 10px; }
  .kb-subnav-item { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: transparent; color: var(--text); border: none; border-radius: 8px; cursor: pointer; font-size: 14px; text-align: left; transition: all .15s; }
  .kb-subnav-item:hover { background: var(--bg-soft); }
  .kb-subnav-item.active { background: rgba(14,165,233,.1); color: var(--accent); font-weight: 600; }
  .kb-side-stats { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
  .kb-stat { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
  .kb-stat .num { font-size: 22px; color: var(--accent); font-weight: 800; font-family: Consolas, monospace; }
  .kb-stat .label { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .kb-side-tip { font-size: 12px; color: var(--text-dim); line-height: 1.6; padding: 0 2px; }

  .kb-content { flex: 1; overflow-y: auto; padding: 24px 28px; }
  .kb-page { max-width: 900px; width: 100%; margin: 0 auto; }
  .kb-page-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .kb-page-title { font-size: 20px; font-weight: 800; color: var(--text-h); }
  .kb-page-sub { font-size: 13px; color: var(--text-sub); margin-top: 4px; }
  .btn-primary { background: linear-gradient(135deg, #0ea5e9, #2563eb); color: #fff; border: none; border-radius: 8px; padding: 9px 18px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all .15s; }
  .btn-primary:hover { box-shadow: 0 4px 12px rgba(14,165,233,.3); }
  .btn-primary:disabled { background: #cbd5e1; cursor: wait; box-shadow: none; }
  .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 9px 16px; cursor: pointer; font-size: 13px; transition: all .15s; }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-success { background: #059669; color: #fff; border: none; border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: 13px; }

  #drop-zone { border: 2px dashed #cbd5e1; border-radius: 12px; background: var(--card); padding: 36px 20px; text-align: center; color: var(--text-sub); cursor: pointer; transition: all 0.18s; margin-bottom: 16px; }
  #drop-zone:hover { border-color: var(--accent); background: rgba(14,165,233,.03); }
  #drop-zone.drag { border-color: var(--accent); background: rgba(14,165,233,.06); }
  #drop-zone .dz-icon { font-size: 34px; margin-bottom: 8px; }
  #drop-zone .dz-link { color: var(--accent); font-weight: 600; }
  #drop-zone .dz-formats { font-size: 12px; color: var(--text-dim); margin-top: 10px; font-family: Consolas, monospace; }
  #upload-status { font-size: 13px; color: var(--green); min-height: 18px; margin-bottom: 12px; }

  .doc-table { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; border-collapse: collapse; overflow: hidden; box-shadow: var(--card-shadow); }
  .doc-table th { text-align: left; font-size: 12px; color: var(--text-sub); font-weight: 600; padding: 10px 16px; background: var(--bg-soft); border-bottom: 1px solid var(--border); }
  .doc-table td { font-size: 14px; color: var(--text); padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .doc-table tr:last-child td { border-bottom: none; }
  .doc-table tr:hover td { background: rgba(14,165,233,.03); }
  .doc-table .doc-name { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-table .del { color: var(--red); cursor: pointer; font-size: 13px; }
  .doc-table .del:hover { text-decoration: underline; }
  #doc-empty { text-align: center; color: var(--text-dim); font-size: 14px; padding: 40px 0; background: var(--card); border: 1px solid var(--border); border-radius: 10px; }

  /* 分块查看/编辑 */
  #chunk-viewer .cv-back { color: var(--accent); cursor: pointer; font-size: 14px; margin-bottom: 12px; }
  #chunk-viewer .cv-back:hover { text-decoration: underline; }
  #chunk-viewer .cv-title { font-size: 16px; font-weight: 600; color: var(--text-h); margin-bottom: 4px; }
  #chunk-viewer .cv-sub { font-size: 13px; color: var(--text-sub); margin-bottom: 16px; }
  .chunk-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; transition: border-color .15s; box-shadow: var(--card-shadow); }
  .chunk-card:hover { border-color: rgba(14,165,233,.3); }
  .chunk-card .ch-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .chunk-card .ch-label { font-size: 12px; font-weight: 600; color: var(--accent); font-family: Consolas, monospace; }
  .chunk-card .ch-actions { display: flex; gap: 8px; }
  .chunk-card .ch-actions button { border: 1px solid var(--border); border-radius: 5px; padding: 4px 10px; font-size: 12px; cursor: pointer; background: transparent; }
  .chunk-card .ch-edit { color: var(--accent); }
  .chunk-card .ch-edit:hover { background: rgba(14,165,233,.08); }
  .chunk-card .ch-save { color: var(--green); display: none; }
  .chunk-card .ch-save:hover { background: rgba(5,150,105,.08); }
  .chunk-card .ch-cancel { color: var(--text-sub); display: none; }
  .chunk-card .ch-cancel:hover { background: var(--bg-soft); }
  .chunk-card .ch-text { font-size: 14px; color: var(--text); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .chunk-card .ch-textarea { width: 100%; min-height: 80px; border: 1px solid var(--border); background: var(--bg-soft); color: var(--text-h); border-radius: 6px; padding: 10px; font-size: 14px; font-family: inherit; outline: none; display: none; resize: vertical; }
  .chunk-card .ch-textarea:focus { border-color: var(--accent); }
  .chunk-card.editing .ch-text { display: none; }
  .chunk-card.editing .ch-textarea { display: block; }
  .chunk-card .ch-images { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; }
  .chunk-card .ch-img-wrap { border: 1px solid var(--border); border-radius: 6px; padding: 6px; background: var(--bg-soft); }
  .chunk-card .ch-img-label { font-size: 12px; color: #2563eb; margin-bottom: 4px; }
  .chunk-card .ch-img { max-width: 300px; max-height: 200px; border-radius: 4px; cursor: zoom-in; display: block; }
  .chunk-card.editing .ch-edit { display: none; }
  .chunk-card.editing .ch-save { display: inline-block; }
  .chunk-card.editing .ch-cancel { display: inline-block; }

  /* 召回测试面板 */
  #retrieval-panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: var(--card-shadow); }
  #rt-run { background: linear-gradient(135deg, #0ea5e9, #2563eb); color: #fff; border: none; border-radius: 8px; padding: 9px 18px; cursor: pointer; font-size: 13px; }
  #rt-run:disabled { background: #cbd5e1; cursor: wait; }
  .rt-result-item { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; transition: border-color .15s; }
  .rt-result-item:hover { border-color: rgba(14,165,233,.3); }

  /* 设置页 */
  .settings-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; box-shadow: var(--card-shadow); }
  .sc-label { font-size: 14px; font-weight: 600; color: var(--text-h); margin-bottom: 8px; }
  .sc-textarea { width: 100%; border: 1px solid var(--border); background: var(--card); color: var(--text-h); border-radius: 8px; padding: 12px; font-size: 13px; font-family: Consolas, monospace; outline: none; resize: vertical; line-height: 1.6; }
  .sc-textarea:focus { border-color: var(--accent); }
  .sc-desc { font-size: 12px; color: var(--text-dim); margin-top: 8px; line-height: 1.5; }
  .sc-option { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; cursor: pointer; }
  .sc-option + .sc-option { border-top: 1px solid var(--border); }
  .sc-option input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .sc-option .opt-name { font-size: 14px; color: var(--text-h); font-weight: 600; }
  .sc-option .opt-desc { font-size: 12px; color: var(--text-dim); margin-top: 2px; line-height: 1.5; }

  /* 通用列表项 / 板块标题 */
  .kb-section { margin-top: 28px; }
  .ua-title { font-size: 16px; font-weight: 700; color: var(--text-h); }
  .ua-sub { font-size: 12px; color: var(--text-sub); margin: 4px 0 12px; }
  .ua-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 12px; transition: border-color .15s; box-shadow: var(--card-shadow); }
  .ua-item:hover { border-color: rgba(14,165,233,.28); }
  .ua-item .ua-q { font-size: 14px; color: var(--text); flex: 1; word-break: break-word; }
  .ua-item .ua-time { font-size: 12px; color: var(--text-dim); white-space: nowrap; font-family: Consolas, monospace; }
  .ua-item .ua-del { color: var(--red); cursor: pointer; font-size: 13px; white-space: nowrap; }
  .ua-item .ua-del:hover { text-decoration: underline; }
  #ua-empty { text-align: center; color: var(--text-dim); font-size: 13px; padding: 20px 0; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
  .ua-empty-box { color: var(--text-dim); font-size: 13px; padding: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-left: 6px; border: 1px solid transparent; }
  .tag-open { background: rgba(14,165,233,.1); color: var(--accent); border-color: rgba(14,165,233,.25); }
  .tag-done { background: rgba(5,150,105,.1); color: var(--green); border-color: rgba(5,150,105,.25); }
  .tag-pending { background: rgba(217,119,6,.1); color: var(--orange); border-color: rgba(217,119,6,.25); }
  .tag-answered { background: rgba(5,150,105,.1); color: var(--green); border-color: rgba(5,150,105,.25); }
  .tag-off { background: var(--bg-soft); color: var(--text-dim); border-color: var(--border); }
  .btn-mini { border: 1px solid var(--border); background: transparent; color: var(--text-sub); border-radius: 4px; padding: 4px 10px; font-size: 12px; cursor: pointer; margin-left: 6px; transition: all .15s; }
  .btn-mini:hover { border-color: var(--accent); color: var(--accent); }
  .btn-mini.danger { color: var(--red); border-color: rgba(239,68,68,.35); }
  .btn-mini.danger:hover { background: rgba(239,68,68,.08); color: var(--red); }
  #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--card); color: var(--text-h); border: 1px solid var(--border); padding: 10px 20px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; box-shadow: 0 4px 16px rgba(0,0,0,.1); }
  #toast.show { opacity: 1; }

  /* 自定义确认框 */
  #confirm-mask { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  #confirm-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px 24px; width: 320px; box-shadow: 0 20px 50px rgba(0,0,0,.15); animation: modalIn .18s ease; }
  #confirm-text { font-size: 14px; color: var(--text); line-height: 1.6; margin-bottom: 18px; word-break: break-word; }
  #confirm-btns { display: flex; justify-content: flex-end; gap: 10px; }
  #confirm-cancel { border: 1px solid var(--border); background: transparent; color: var(--text-sub); border-radius: 6px; padding: 7px 16px; font-size: 13px; cursor: pointer; }
  #confirm-cancel:hover { border-color: var(--text-sub); color: var(--text); }
  #confirm-ok { border: none; background: linear-gradient(135deg, #dc2626, #ef4444); color: #fff; border-radius: 6px; padding: 7px 16px; font-size: 13px; cursor: pointer; }
  #confirm-ok:hover { box-shadow: 0 4px 12px rgba(239,68,68,.3); }

  .form-input { border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; font-size: 13px; outline: none; background: var(--card); color: var(--text); }
  .form-input:focus { border-color: var(--accent); }

  /* ========== 数字人面板 ========== */
  #avatar-toggle { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--card); color: var(--text-sub); font-size: 13px; cursor: pointer; transition: all .15s; }
  #avatar-toggle:hover { border-color: var(--accent); color: var(--accent); }
  #avatar-toggle.active { background: var(--accent-soft); color: var(--accent); border-color: rgba(14,165,233,.3); }

  /* 数字人：右下角悬浮小窗（口播模式），可最小化为一条工具栏 */
  #avatar-panel { position: fixed; right: 24px; bottom: 24px; width: 300px; height: 400px; z-index: 900;
    background: #0b0e1a; border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,.28); display: flex; flex-direction: column; }
  #avatar-panel.minimized { height: auto; }
  #avatar-panel .avatar-toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    background: rgba(0,0,0,.3); border-bottom: 1px solid rgba(255,255,255,.08); }
  #avatar-panel .avatar-toolbar select { flex: 1; min-width: 0; background: rgba(255,255,255,.08); color: #e0e0e0;
    border: 1px solid rgba(255,255,255,.12); border-radius: 6px; padding: 4px 6px; font-size: 12px; outline: none; cursor: pointer; }
  #avatar-panel .avatar-toolbar select:hover { border-color: var(--accent); }
  #avatar-panel .avatar-toolbar .close-avatar,
  #avatar-panel .avatar-toolbar .min-avatar { background: none; border: none; color: rgba(255,255,255,.5);
    cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
  #avatar-panel .avatar-toolbar .close-avatar:hover,
  #avatar-panel .avatar-toolbar .min-avatar:hover { color: #fff; background: rgba(255,255,255,.1); }
  #avatar-panel .avatar-frame { flex: 1; position: relative; overflow: hidden; }
  #avatar-panel iframe { width: 100%; height: 100%; border: none; display: block; }
  #avatar-panel .avatar-mini-hint { color: rgba(255,255,255,.55); font-size: 12px; padding: 0 4px 6px 10px; }
</style>
</head>
<body>
  <!-- Vue 挂载点：顶部导航 + 主区（5 个视图） + 全局弹层 -->
  <div id="app">
    <app-navbar @nav="onNav"></app-navbar>
    <div id="main">
      <chat-view v-show="store.view === 'chat'"></chat-view>
      <kb-view ref="kbView" v-show="store.view === 'kb'"></kb-view>
      <dashboard-view ref="dashView" v-show="store.view === 'dashboard'"></dashboard-view>
      <memory-view ref="memView" v-show="store.view === 'memory'"></memory-view>
      <settings-view ref="settingsView" v-show="store.view === 'settings'"></settings-view>
    </div>
    <confirm-modal></confirm-modal>
    <toast-box></toast-box>
  </div>

  <!-- ================= 组件模板 ================= -->
  <!-- 顶部横向导航栏（一级菜单） -->
  <script type="text/x-template" id="tpl-navbar">
    <div id="navbar">
      <div class="navbar-logo">🤖 RAG AI 客服</div>
      <div class="navbar-nav">
        <button class="nav-item" v-for="n in navs" :key="n.key"
                :class="{ active: store.view === n.key }"
                @click="$emit('nav', n.key)">{{ n.label }}</button>
      </div>
      <div class="navbar-right"></div>
    </div>
  </script>

  <!-- 对话视图：左侧会话面板 + 右侧（顶栏 + 消息流 + 输入区） -->
  <script type="text/x-template" id="tpl-chat-view">
    <div id="chat-view" class="main-view">
      <div id="chat-layout">
        <!-- 左侧：会话列表 -->
        <div id="session-panel">
          <button id="new-chat" @click="store.newSession()">＋ 新建对话</button>
          <button id="export-chat" title="导出当前会话为 Markdown" @click="exportSession"
                  style="width:100%;margin-top:6px;padding:8px;border:1px solid var(--border);background:var(--card);color:var(--text-sub);border-radius:8px;cursor:pointer;font-size:13px;">📥 导出对话</button>
          <div id="session-list">
            <div v-if="!store.sessions.length" style="color:var(--text-sub);font-size:12px;padding:4px">暂无对话</div>
            <div class="session-item" v-for="s in store.sessions" :key="s.id"
                 :class="{ active: s.id === store.currentSession }"
                 @click="store.switchSession(s.id)">
              <span class="title">{{ s.title }}</span>
              <span class="del" title="删除" @click.stop="store.deleteSession(s.id)">✕</span>
            </div>
          </div>
        </div>
        <!-- 右侧：对话主区 -->
        <div id="chat-main">
          <div id="topbar">
            <span id="topbar-title">AI 客服</span>
            <div id="topbar-right">
              <button id="avatar-toggle" :class="{ active: showAvatar }" @click="toggleAvatar" title="开启后 AI 回答由数字人语音播报（不影响文字回复）">
                🧑‍💼 数字人口播
              </button>
              <span class="topbar-hint">{{ useKb ? '知识库问答已开启' : '直接对话模式' }} · {{ model || '默认模型' }}</span>
            </div>
          </div>
          <div id="chat-box" ref="chatBox">
            <div id="welcome" v-if="!store.messages.length">
              <div class="big">💬</div>
              <div class="welcome-title">你好，我是 AI 客服</div>
              <div class="welcome-sub">在下方输入框提问，也可以点开「快速」选择常见问题</div>
            </div>
            <div class="msg" v-for="(m, i) in store.messages" :key="i" :class="m.role">
              <div v-if="m.toolCall" class="tool-call">{{ m.toolCall }}</div>
              <div v-if="m.slowTip" class="slow-tip">正在等待模型响应，首次加载大模型可能需要 1~2 分钟…</div>
              <div v-if="m.images && m.images.length" class="msg-imgs">
                <img v-for="(img, j) in m.images" :key="j" :src="'data:image/jpeg;base64,' + img"
                     @click="previewImg = img" title="点击放大预览" style="cursor:zoom-in;">
              </div>
              <span class="content"><span v-if="m.content === null" class="typing"><span></span><span></span><span></span></span><template v-else>{{ m.content }}</template></span>
              <div v-if="m.stage && m.content === null" class="stage-tip">
                {{ m.stage.content }}<span v-if="m.stage.elapsed_ms" class="stage-time">({{ (m.stage.elapsed_ms/1000).toFixed(1) }}s)</span>
              </div>
              <!-- 相关图片（RAG 召回命中的带图 chunk）——内联在答案和参考来源之间 -->
              <div v-if="m.sources && m.sources.some(s => s.image)" class="ans-images">
                <div class="ans-images-title">📎 相关图片</div>
                <div class="ans-images-grid">
                  <div v-for="(s, si) in m.sources.filter(s => s.image)" :key="'ai-'+si" class="ans-img-card">
                    <img :src="s.image.split(';')[0]" class="ans-img"
                         @click="previewSrcImg(s.image.split(';')[0])">
                    <div class="ans-img-footer">
                      <span class="ans-img-src">📄 {{ s.doc }}</span>
                      <span v-if="s.score" class="ans-img-score">{{ Math.round(s.score*100) }}%</span>
                    </div>
                  </div>
                </div>
              </div>
              <div v-if="m.sources && m.sources.length" class="sources">
                参考来源:
                <span v-for="(s, si) in m.sources" :key="si" class="src-chip"
                      :title="`得分 ${s.score}，点击定位到分块`" @click="jumpToSource(s)">
                  {{ s.has_image ? '🖼️' : '📄' }} {{ s.doc }}<i>{{ s.score }}</i>
                </span>
              </div>
              <div v-if="m.totalMs" class="msg-time">
                ⏱ 总耗时 {{ (m.totalMs/1000).toFixed(1) }}s
                <span v-if="m.traceId" class="trace-link" @click="viewTrace(m.traceId)">查看链路 →</span>
              </div>
              <div class="msg-actions" v-if="m.role === 'assistant'">
                <button class="ma-btn" @click="copyMsg(m)">📋 复制</button>
                <button class="ma-btn" @click="regen(m)">🔄 重新生成</button>
                <button class="ma-btn" @click="feedback(1)">👍</button>
                <button class="ma-btn" @click="feedback(-1)">👎</button>
              </div>
              <div class="sugg-follow" v-if="m.role === 'assistant' && m.content && i === store.messages.length - 1 && !sending">
                <span class="sugg-follow-label">继续问：</span>
                <span class="sugg-chip" v-for="(f, fi) in followUps" :key="fi" @click="pickPrompt(f)">{{ f }}</span>
              </div>
            </div>
          </div>
          <div id="input-area">
            <input type="file" ref="imgInput" hidden multiple accept="image/*" @change="onImgChange">
            <!-- 图片大图预览灯箱 -->
            <div v-if="previewImg" class="img-lightbox" @click="previewImg = null">
              <!-- base64（用户上传的图） -->
              <img v-if="previewImg.startsWith && previewImg.startsWith('data:')" :src="previewImg" class="img-lightbox-inner">
              <!-- URL（知识库召回的图） -->
              <img v-else :src="previewImg" class="img-lightbox-inner">
              <div class="img-lightbox-tip">点击任意处关闭</div>
            </div>
            <div id="composer">
              <div id="img-preview" v-show="pendingImages.length">
                <div v-for="(b64, i) in pendingImages" :key="i" style="position:relative;width:64px;height:64px;">
                  <img :src="'data:image/jpeg;base64,' + b64" @click="previewImg = b64" title="点击放大预览"
                       style="width:64px;height:64px;object-fit:contain;background:#f1f5f9;border-radius:8px;border:1px solid var(--border);cursor:zoom-in;">
                  <span class="img-del" @click.stop="pendingImages.splice(i, 1)"
                        style="position:absolute;top:-6px;right:-6px;background:#ef4444;color:#fff;border-radius:50%;width:18px;height:18px;font-size:12px;line-height:18px;text-align:center;cursor:pointer;">×</span>
                </div>
              </div>
              <textarea id="input" ref="inputEl" rows="2" v-model="inputText"
                        placeholder="向 AI 客服提问，Enter 发送，Shift+Enter 换行"
                        @keydown.enter.exact.prevent="send()"></textarea>

              <div class="composer-bar">
                <!-- ＋ 上传图片 -->
                <button class="cb-btn cb-icon" title="上传图片提问" @click="$refs.imgInput.click()">＋</button>

                <!-- ⚡ 快速：快捷提问模板 -->
                <div class="cb-menu-wrap">
                  <button class="cb-btn" :class="{ active: quickOpen }" @click="toggleMenu('quick')">
                    ⚡ 快速 <span class="cb-caret">▾</span>
                  </button>
                  <div v-if="quickOpen" class="cb-menu">
                    <div class="cb-menu-title">快捷提问（点击填入输入框）</div>
                    <div class="cb-menu-item" v-for="(p, i) in quickPrompts" :key="i"
                         @mousedown.prevent="applyPrompt(p)">
                      <span class="mi-icon">{{ p.icon }}</span>{{ p.text }}
                    </div>
                  </div>
                </div>

                <!-- 知识库开关 -->
                <div class="cb-menu-wrap">
                  <button class="cb-btn" :class="{ active: useKb }" @click="toggleMenu('kb')">
                    🔎 {{ kbLabel }} <span class="cb-caret">▾</span>
                  </button>
                  <div v-if="kbOpen" class="cb-menu">
                    <div class="cb-menu-title">知识库问答</div>
                    <div class="cb-menu-item" @mousedown.prevent="setUseKb(false)">
                      <span class="mi-icon">💬</span>直接对话
                      <span class="mi-sub" v-if="!useKb">✓</span>
                    </div>
                    <div class="cb-menu-item" @mousedown.prevent="setUseKb(true)">
                      <span class="mi-icon">🔎</span>检索知识库
                      <span class="mi-sub" v-if="useKb">✓</span>
                    </div>
                    <div class="cb-menu-title">检索范围</div>
                    <div class="cb-menu-item" @mousedown.prevent="setKbId('')">
                      <span class="mi-icon">🗂</span>全部知识库
                      <span class="mi-sub" v-if="!kbId">✓</span>
                    </div>
                    <div class="cb-menu-item" v-for="kb in store.kbList" :key="kb.id" @mousedown.prevent="setKbId(kb.id)">
                      <span class="mi-icon">📁</span>{{ kb.name }}
                      <span class="mi-sub" v-if="kbId === kb.id">✓</span>
                    </div>
                  </div>
                </div>

                <!-- 🛠 工具：下拉勾选可用工具 -->
                <div class="cb-menu-wrap">
                  <button class="cb-btn" :class="{ active: useTools }" @click="toggleMenu('tools')">
                    🛠 工具 <span class="cb-caret">▾</span>
                  </button>
                  <div v-if="toolsOpen" class="cb-menu">
                    <div class="cb-menu-item" @mousedown.prevent="setUseTools(!useTools)">
                      <span class="mi-icon">{{ useTools ? '✅' : '⬜' }}</span>启用 Agent 工具
                      <span class="mi-sub" v-if="useTools">✓</span>
                    </div>
                    <div class="cb-menu-title">可用工具（点击勾选）</div>
                    <div class="cb-menu-item" v-for="t in toolList" :key="t.name"
                         :style="{ opacity: useTools ? 1 : 0.45 }"
                         @mouseenter="hoverTool = t.name"
                         @mousedown.prevent="toggleTool(t.name)">
                      <span class="mi-icon">{{ toolIcon(t.name) }}</span>
                      <span>{{ t.label || t.name }} <span style="opacity:.5;font-size:12px;">{{ t.name }}</span></span>
                      <span class="mi-sub">{{ isToolEnabled(t.name) ? '✓' : '' }}</span>
                    </div>
                    <div class="cb-menu-title" style="white-space:normal;line-height:1.5;">工具说明：{{ (toolList.find(t => t.name === hoverTool) || {}).description || '悬停查看说明' }}</div>
                  </div>
                </div>

                <!-- 更多：模型选择等 -->
                <div class="cb-menu-wrap">
                  <button class="cb-btn" :class="{ active: moreOpen }" @click="toggleMenu('more')">
                    ≡ 更多 <span class="cb-caret">▾</span>
                  </button>
                  <div v-if="moreOpen" class="cb-menu">
                    <div class="cb-menu-title">选择模型</div>
                    <div class="cb-menu-title" v-if="!models.length">{{ modelHint }}</div>
                    <div class="cb-menu-item" v-for="m in models" :key="m" @mousedown.prevent="setModel(m)">
                      <span class="mi-icon">🧠</span>{{ m }}
                      <span class="mi-sub" v-if="model === m">✓</span>
                    </div>
                    <div class="cb-menu-item" @mousedown.prevent="setModel('')">
                      <span class="mi-icon">⚙️</span>默认模型
                      <span class="mi-sub" v-if="!model">✓</span>
                    </div>
                  </div>
                </div>

                <div class="cb-spacer"></div>
                <button class="cb-send" :class="{ stop: sending }" :disabled="!inputText.trim() && !pendingImages.length && !sending"
                        :title="sending ? '停止生成' : '发送（Enter）'" @click="sending ? stop() : send()">
                  {{ sending ? '■' : '↑' }}
                </button>
              </div>
            </div>
          </div>
          <!-- 引用分块查看弹窗 -->
          <div v-if="chunkView" class="modal-mask" @click="chunkView = null">
            <div class="modal" style="max-width:640px;" @click.stop>
              <div class="modal-head">📄 {{ chunkView.doc }}（分块 {{ chunkView.index }}）
                <span style="float:right;color:var(--accent);font-size:13px;">得分 {{ chunkView.score }}</span>
              </div>
              <div style="max-height:70vh;overflow:auto;white-space:pre-wrap;word-break:break-word;padding:16px;background:var(--card);border-radius:8px;border:1px solid var(--border);font-size:14px;line-height:1.8;color:var(--text);">
                {{ chunkView.text }}
              </div>
              <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;">
                <button class="btn-ghost" @click="chunkView = null">关闭</button>
              </div>
            </div>
          </div>
        </div>
        <!-- 数字人口播小窗：右下角悬浮，可最小化 -->
        <div id="avatar-panel" v-if="showAvatar" :class="{ minimized: avatarMin }">
          <div class="avatar-toolbar">
            <template v-if="!avatarMin">
              <select v-model="avatarAsset" @change="onAvatarConfigChange">
                <option value="assets">角色 A · 男</option>
                <option value="assets6">角色 B · 女客服</option>
                <option value="assets7">角色 C · 女旗袍</option>
                <option value="assets8">角色 D · 女白领</option>
              </select>
              <select v-model="avatarVoice" @change="onAvatarConfigChange">
                <option value="zh-CN-YunxiNeural">男声 · 云希</option>
                <option value="zh-CN-YunjianNeural">男声 · 云健</option>
                <option value="zh-CN-XiaoxiaoNeural">女声 · 晓晓</option>
                <option value="zh-CN-XiaoyiNeural">女声 · 晓伊</option>
                <option value="zh-CN-XiaohanNeural">女声 · 晓涵</option>
              </select>
            </template>
            <span v-else class="avatar-mini-hint">🧑‍💼 数字人口播中</span>
            <button class="min-avatar" @click="avatarMin = !avatarMin" :title="avatarMin ? '展开数字人' : '最小化'">{{ avatarMin ? '▢' : '—' }}</button>
            <button class="close-avatar" @click="toggleAvatar" title="关闭数字人口播">✕</button>
          </div>
          <div class="avatar-frame" v-show="!avatarMin">
            <iframe :src="avatarUrl" ref="avatarFrame" allow="microphone; autoplay"></iframe>
          </div>
        </div>
      </div>
    </div>
  </script>

  <!-- 知识库管理视图（二级子菜单 + 内容区） -->
  <script type="text/x-template" id="tpl-kb-view">
    <div id="kb-view" class="main-view">
      <div class="kb-layout">
        <!-- 左侧：二级子菜单 -->
        <div class="kb-subnav">
          <div class="kb-subnav-title">知识库</div>
          <button class="kb-subnav-item" v-for="t in kbTabs" :key="t.key"
                  :class="{ active: kbTab === t.key }"
                  @click="kbTab = t.key">{{ t.label }}</button>
          <div class="kb-side-stats">
            <div class="kb-stat">
              <div class="num">{{ store.statDocs }}</div>
              <div class="label">已上传文档</div>
            </div>
            <div class="kb-stat">
              <div class="num">{{ store.statChunks }}</div>
              <div class="label">知识分块总数</div>
            </div>
            <div class="kb-side-tip">
              文档上传后自动切分并向量化，提问时检索最相关片段交给大模型作答。
            </div>
          </div>
        </div>
        <!-- 右侧：内容区（按 kbTab 切换） -->
        <div class="kb-content">
          <div class="kb-page">
            <div class="kb-page-head">
              <div>
                <div class="kb-page-title">知识库管理</div>
                <div class="kb-page-sub">文档上传后自动切分并向量化，供对话检索引用</div>
              </div>
              <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                <select id="upload-kb" v-model="uploadKb">
                  <option value="default">默认知识库</option>
                  <option v-for="kb in store.kbList" :key="kb.id" :value="kb.id">{{ kb.name }}</option>
                </select>
                <button class="btn-secondary" @click="showKbModal = true">＋ 新建知识库</button>
                <button class="btn-primary" :disabled="uploading" @click="openUploadModal([])">＋ 上传文档</button>
              </div>
            </div>

            <!-- 文档列表 -->
            <div v-show="kbTab === 'docs'">
              <!-- 分块查看/编辑面板 -->
              <div id="chunk-viewer" v-if="chunkDoc">
                <div class="cv-back" @click="backToDocs">← 返回文档列表</div>
                <div class="cv-title">{{ chunkDoc.name }}</div>
                <div class="cv-sub">点击「编辑」可修改分块内容，保存后自动重新生成向量</div>
                <div id="chunk-list">
                  <div v-if="chunksLoading" style="color:var(--text-sub);font-size:14px;">加载中...</div>
                  <div v-else-if="chunksError" style="color:#ef4444">加载失败: {{ chunksError }}</div>
                  <chunk-card v-else v-for="ch in chunks" :key="ch.index" :chunk="ch" :doc-id="chunkDoc.id"></chunk-card>
                </div>
              </div>

              <template v-else>
                <!-- 拖拽上传区 -->
                <div id="drop-zone" :class="{ drag: dragOver }"
                     @click="$refs.fileInput.click()"
                     @dragenter.prevent="dragOver = true"
                     @dragover.prevent="dragOver = true"
                     @dragleave.prevent="dragOver = false"
                     @drop.prevent="onDrop">
                  <div class="dz-icon">📁</div>
                  拖拽文件到此处，或 <span class="dz-link">点击选择文件</span>（支持多选）
                  <div class="dz-formats">支持格式：txt、md、docx、doc、xlsx、xls、pdf、jpg、png 等图片</div>
                </div>
                <input type="file" ref="fileInput" hidden multiple accept=".txt,.md,.markdown,.docx,.doc,.xlsx,.xls,.pdf,.jpg,.jpeg,.png,.gif,.webp,.bmp" @change="onFilePick">
                <div id="upload-status">{{ uploadStatus }}</div>

                <!-- 文档列表 -->
                <div id="doc-list">
                  <table class="doc-table" v-if="docs.length">
                    <thead><tr><th>文档名称</th><th>分块数</th><th>上传时间</th><th style="width:60px">操作</th></tr></thead>
                    <tbody>
                      <tr v-for="d in docs" :key="d.id">
                        <td class="doc-name" :title="d.name" style="cursor:pointer;color:#2563eb" @click="showChunks(d)"><u>{{ d.name }}</u></td>
                        <td>{{ d.chunks }}</td>
                        <td>{{ d.created }}</td>
                        <td><span class="del" @click="delDoc(d)">删除</span></td>
                      </tr>
                    </tbody>
                  </table>
                  <div id="doc-empty" v-else>还没有文档，拖拽文件到上方区域开始构建知识库</div>
                </div>
              </template>
            </div>

            <!-- FAQ -->
            <div v-show="kbTab === 'faq'">
              <div class="ua-title">⚡ FAQ 快捷回复</div>
              <div class="ua-sub">命中后毫秒级直接回复，不调用大模型。支持模糊匹配。</div>
              <div style="display:flex; gap:8px; margin-bottom:12px;">
                <input id="faq-q" v-model="faqQ" placeholder="问题" class="form-input" style="flex:1;">
                <input id="faq-a" v-model="faqA" placeholder="答案" class="form-input" style="flex:1;">
                <button id="faq-add" class="btn-success" @click="addFaq">添加</button>
              </div>
              <div id="faq-list">
                <div v-if="!faqs.length" class="ua-empty-box">暂无 FAQ，添加后命中将直接回复</div>
                <div class="ua-item" v-for="item in faqs" :key="item.id">
                  <div class="ua-q"><b>Q:</b> {{ item.question }}<br><b>A:</b> {{ item.answer }}</div>
                  <span class="ua-del" @click="delFaq(item)">删除</span>
                </div>
              </div>
            </div>

            <!-- 意图规则 -->
            <div v-show="kbTab === 'intent'">
              <div class="ua-title">🎯 意图识别规则</div>
              <div class="ua-sub">命中关键词后自动执行动作：固定回复 / 创建工单 / 转人工</div>
              <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
                <input id="ir-name" v-model="irName" placeholder="意图名称" class="form-input" style="width:120px;">
                <input id="ir-keywords" v-model="irKeywords" placeholder="关键词，逗号分隔" class="form-input" style="flex:1; min-width:150px;">
                <select id="ir-action" v-model="irAction">
                  <option value="reply">固定回复</option>
                  <option value="ticket">创建工单</option>
                  <option value="handoff">转人工</option>
                </select>
                <input id="ir-reply" v-model="irReply" placeholder="回复话术" class="form-input" style="flex:1; min-width:150px;">
                <button id="ir-add" class="btn-success" @click="addRule">添加</button>
              </div>
              <div id="intent-list">
                <div v-if="!rules.length" class="ua-empty-box">暂无规则</div>
                <div class="ua-item" v-for="r in rules" :key="r.id">
                  <div class="ua-q">
                    <b>{{ r.name }}</b> <span class="tag" :class="r.enabled ? '' : 'tag-off'">{{ r.enabled ? '启用' : '停用' }}</span><br>
                    <span style="font-size:12px;color:var(--text-sub);">关键词: {{ r.keywords }} → {{ actionMap[r.action] || r.action }}</span>
                  </div>
                  <div>
                    <button class="btn-mini" @click="toggleRule(r)">{{ r.enabled ? '停用' : '启用' }}</button>
                    <button class="btn-mini danger" @click="delRule(r)">删除</button>
                  </div>
                </div>
              </div>
            </div>

            <!-- 工单 -->
            <div v-show="kbTab === 'ticket'">
              <div class="ua-title">📋 工单管理</div>
              <div class="ua-sub">意图识别命中"创建工单"后自动记录，可标记处理状态</div>
              <div id="ticket-list">
                <div v-if="!tickets.length" class="ua-empty-box">暂无工单</div>
                <div class="ua-item" v-for="t in tickets" :key="t.id">
                  <div class="ua-q">
                    <b>#{{ t.id }}</b> [{{ t.intent }}] {{ t.question }}<br>
                    <span style="font-size:12px;color:var(--text-dim);">{{ t.created }}</span>
                  </div>
                  <div>
                    <span class="tag" :class="t.status === 'done' ? 'tag-done' : 'tag-open'">{{ t.status === 'done' ? '已处理' : '待处理' }}</span>
                    <button class="btn-mini" @click="toggleTicket(t)">{{ t.status === 'done' ? '重开' : '标记处理' }}</button>
                  </div>
                </div>
              </div>
            </div>

            <!-- 转人工 -->
            <div v-show="kbTab === 'handoff'">
              <div class="ua-title">👤 转人工请求</div>
              <div class="ua-sub">用户触发"转人工"意图后自动记录</div>
              <div id="handoff-list">
                <div v-if="!handoffs.length" class="ua-empty-box">暂无转人工请求</div>
                <div class="ua-item" v-for="h in handoffs" :key="h.id">
                  <div class="ua-q">
                    {{ h.question }}<br>
                    <span style="font-size:12px;color:var(--text-dim);">{{ h.created }} · 会话 {{ h.session_id }}</span>
                  </div>
                  <div>
                    <span class="tag" :class="h.status === 'answered' ? 'tag-answered' : 'tag-pending'">{{ h.status === 'answered' ? '已接入' : '待接入' }}</span>
                    <button class="btn-mini" @click="toggleHandoff(h)">{{ h.status === 'answered' ? '标记待接入' : '标记已接入' }}</button>
                  </div>
                </div>
              </div>
            </div>

            <!-- 未命中问题 -->
            <div v-show="kbTab === 'unanswered'">
              <div class="ua-title">💡 待补充问题</div>
              <div class="ua-sub">用户问过但知识库未命中的问题，可据此补充文档或 FAQ</div>
              <div id="unanswered-list">
                <div id="ua-empty" v-if="!unanswered.length">暂无待补充问题。用户问到知识库没有的内容时会自动收集到这里</div>
                <div class="ua-item" v-for="item in unanswered" :key="item.id">
                  <span class="ua-q">{{ item.question }}</span>
                  <span class="ua-time">{{ item.created }}</span>
                  <span class="ua-del" @click="delUnanswered(item)">删除</span>
                </div>
              </div>
            </div>

            <!-- 召回测试 -->
            <div v-show="kbTab === 'retrieval'">
              <div class="ua-title">🔍 召回测试</div>
              <div class="ua-sub">输入一个用户问题，测试会命中知识库中哪些分块</div>
              <retrieval-panel ref="rtPanel"></retrieval-panel>
            </div>
          </div>
        </div>
      </div>

      <!-- 新建知识库弹窗 -->
      <kb-modal v-if="showKbModal" @cancel="showKbModal = false" @create="createKb"></kb-modal>
      <!-- 上传弹窗：本地文件 / 从 URL 导入 -->
      <upload-modal v-if="showUploadModal" :files="pendingFiles" :default-kb="uploadKb" :busy="urlFetching"
                    @cancel="closeUploadModal" @submit="handleUpload"></upload-modal>
    </div>
  </script>

  <!-- 召回测试面板 -->
  <script type="text/x-template" id="tpl-retrieval-panel">
    <div id="retrieval-panel">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <input id="rt-query" ref="queryEl" v-model="query" placeholder="输入一个用户问题，测试会命中哪些分块"
               class="form-input" style="flex:1;min-width:240px;"
               @keydown.enter="run">
        <select id="rt-kb" v-model="kbId">
          <option value="">全部知识库</option>
          <option v-for="kb in store.kbList" :key="kb.id" :value="kb.id">{{ kb.name }}</option>
        </select>
        <select id="rt-topk" v-model="topK">
          <option :value="3">Top 3</option><option :value="5">Top 5</option><option :value="10">Top 10</option>
        </select>
        <button id="rt-run" :disabled="running" @click="run">{{ running ? '检索中…' : '测试' }}</button>
        <span id="rt-elapsed" style="font-size:12px;color:var(--text-dim);">{{ elapsed }}</span>
      </div>
      <div id="rt-results" style="margin-top:12px;">
        <div v-if="running" style="color:var(--text-dim);font-size:13px;padding:8px 0;">正在召回分块…</div>
        <div v-else-if="error" style="color:#dc2626;font-size:13px;padding:8px 0;">{{ error }}</div>
        <div v-else-if="results && !results.length" style="color:#dc2626;font-size:13px;padding:8px 0;">⚠ 未命中任何分块——回答不出来是知识库的问题，请补充文档或 FAQ</div>
        <div v-else-if="results">
          <div class="rt-result-item" v-for="(it, i) in results" :key="i">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
              <span style="font-size:12px;color:var(--text-sub);">#{{ i + 1 }} · {{ it.doc }}</span>
              <span style="font-size:12px;font-weight:600;" :style="{ color: scoreColor(it.score) }">得分 {{ it.score }}</span>
            </div>
            <div style="height:4px;background:var(--bg-soft);border-radius:2px;margin-bottom:8px;">
              <div style="height:4px;border-radius:2px;" :style="{ width: scorePct(it.score) + '%', background: scoreColor(it.score) }"></div>
            </div>
            <div style="font-size:13px;color:var(--text);line-height:1.6;white-space:pre-wrap;max-height:120px;overflow:auto;">{{ it.text }}</div>
          </div>
        </div>
      </div>
    </div>
  </script>

  <!-- 分块卡片（编辑/保存/取消） -->
  <script type="text/x-template" id="tpl-chunk-card">
    <div class="chunk-card" :class="{ editing: editing }">

        <div class="ch-actions">

          <button class="ch-cancel" @click="cancel">取消</button>

  <!-- 新建知识库弹窗 -->
  <script type="text/x-template" id="tpl-kb-modal">
    <div class="modal-mask">
      <div class="modal">
        <h3>新建知识库</h3>

  <!-- 上传弹窗（本地文件 / 从 URL 导入） -->
  <script type="text/x-template" id="tpl-upload-modal">
    <div class="modal-mask">
      <div class="modal">
        <h3>上传文档</h3>
        <div style="display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px;">
          <div class="upload-tab" :class="{ active: tab === 'file' }" @click="tab = 'file'">本地文件</div>
          <div class="upload-tab" :class="{ active: tab === 'url' }" @click="tab = 'url'">从 URL 导入</div>
        </div>

        <!-- 本地文件页签 -->
        <div v-show="tab === 'file'">
          <div class="field">
            <label>待上传文件</label>
            <div id="upload-file-names" style="font-size:13px;color:var(--text);background:var(--bg-soft);border-radius:8px;padding:10px 12px;max-height:100px;overflow-y:auto;">
              <div v-if="!files.length" style="color:var(--text-dim);">尚未选择文件，可点击下方「本地文件」页签或拖拽到上传区域选择</div>
              <div v-for="(f, i) in files" :key="i">📄 {{ f.name }} <span style="color:var(--text-dim);">({{ fmtSize(f) }})</span></div>
            </div>
          </div>
        </div>

        <!-- URL 导入页签 -->
        <div v-show="tab === 'url'">
          <div class="field">
            <label>网页地址 <span style="color:#ef4444">*</span></label>
            <input type="text" v-model="url" placeholder="https://example.com/docs/page" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;">
          </div>
          <div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">抓取网页正文并自动切分入库，适合导入在线文档、帮助中心页面。</div>
        </div>

        <div class="field">
          <label>目标知识库</label>
          <select v-model="targetKb" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;">
            <option value="default">默认知识库</option>
            <option v-for="kb in store.kbList" :key="kb.id" :value="kb.id">{{ kb.name }}</option>
          </select>
        </div>
        <div class="field">
          <label>分段最大长度 <span class="range-val">{{ chunkSize }}</span> 字符</label>
          <input type="range" min="100" max="1500" step="50" v-model="chunkSize">
        </div>
        <div class="field">
          <label>分段重叠长度 <span class="range-val">{{ chunkOverlap }}</span> 字符</label>
          <input type="range" min="0" max="200" step="10" v-model="chunkOverlap">
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:#94a3b8;">
          <input type="checkbox" id="chunk-mode-pc" v-model="parentChild" style="width:16px;height:16px;cursor:pointer;">
          <label for="chunk-mode-pc" style="cursor:pointer;">父子分段（子块做检索、命中后取父块喂模型，保留更完整上下文）</label>
        </div>
        <div style="font-size:12px;color:var(--text-dim);">较大的分段保留更多上下文但检索更粗略；重叠可缓解分段边界的语义割裂。</div>
        <div class="modal-actions">
          <button class="btn-cancel" @click="$emit('cancel')">取消</button>
          <button class="btn-ok" :disabled="busy" @click="ok">{{ busy ? '抓取中…' : '开始上传' }}</button>
        </div>
      </div>
    </div>

  <!-- 设置视图 -->
  <script type="text/x-template" id="tpl-settings-view">

      <div class="settings-page">
        <!-- 左侧二级子菜单 -->
        <div class="dash-subnav">
          <div v-for="t in tabs" :class="['ds-item', { active: setTab === t.key }]" @click="setTab = t.key">

          </div>
          <div class="ds-foot"><div style="font-size:12px;color:var(--text-dim);">修改后即时保存生效</div></div>
        </div>
        <!-- 右侧内容 -->
        <div class="settings-content">
          <!-- 固定保存栏 -->
          <div class="settings-toolbar">
            <div class="st-title">系统设置</div>
            <div class="st-actions">
              <button class="btn-ghost" @click="resetDefaults">↺ 重置默认</button>
              <button class="btn-primary" :disabled="saving" @click="save">{{ saving ? '保存中...' : '保存设置' }}</button>
            </div>
          </div>

          <!-- 提示词 -->
          <div v-show="setTab === 'prompt'">
            <div class="panel">
              <div class="form-block">
                <div class="fb-label">知识库问答提示词 <span class="fb-tag">开启检索时使用</span></div>
                <textarea class="fb-textarea" rows="10" v-model="kbPrompt"></textarea>
                <div class="fb-desc">支持 <code>{context}</code> 占位符，自动注入检索到的知识库内容。建议保留"只能基于资料""绝不使用自己的知识"等严格限制。</div>
              </div>
            </div>
            <div class="panel">
              <div class="form-block">
                <div class="fb-label">无匹配资料提示词 <span class="fb-tag">检索未命中时使用</span></div>
                <textarea class="fb-textarea" rows="4" v-model="noMatchPrompt"></textarea>
                <div class="fb-desc">此时不会传入知识库内容，建议让模型明确说"暂无资料"，禁止编造。</div>
              </div>
            </div>
            <div class="panel">
              <div class="form-block">
                <div class="fb-label">直接对话提示词 <span class="fb-tag">关闭知识库时使用</span></div>
                <textarea class="fb-textarea" rows="4" v-model="directPrompt"></textarea>
                <div class="fb-desc">此模式下模型完全基于自身知识回答，不受知识库约束。</div>
              </div>
            </div>
          </div>

          <!-- 安全 -->
          <div v-show="setTab === 'security'">
            <div class="panel">
              <div class="form-block">
                <div class="fb-label">敏感词库 <span class="fb-tag">一行一个词</span></div>
                <textarea class="fb-textarea" rows="8" placeholder="一行一个敏感词" v-model="sensitiveWords"></textarea>
                <div class="fb-desc">用户输入命中 → 直接拦截不调用模型；模型输出命中 → 自动替换为安全回复。保存后立即生效。</div>
              </div>
            </div>
          </div>

          <!-- 检索配置 -->
          <div v-show="setTab === 'retrieval'">
            <div class="panel">
              <div class="form-row">
                <div class="fr-info">
                  <div class="fr-name">查询改写</div>
                  <div class="fr-desc">多轮对话时自动把"它/这个"等指代改写成完整问题再检索，提升多轮命中率。会额外增加一次模型调用。</div>
                </div>
                <label class="toggle"><input type="checkbox" v-model="rewriteEnabled"><span class="slider"></span></label>
              </div>
              <div class="form-divider"></div>
              <div class="form-row">
                <div class="fr-info">
                  <div class="fr-name">重排序（Rerank）</div>
                  <div class="fr-desc">向量初检后，融合"查询词面重叠率"重新打分排序。纯本地计算，几乎无开销。</div>
                </div>
                <label class="toggle"><input type="checkbox" v-model="rerankEnabled"><span class="slider"></span></label>
              </div>
              <div v-if="rerankEnabled" class="form-sub">
                <div class="range-block">
                  <div class="fb-label">向量分数权重</div>
                  <input type="range" min="0" max="1" step="0.05" v-model="rerankWeight" class="fb-range">
                  <div class="range-meta">
                    <span>0（纯关键词）</span>
                    <span class="range-val">{{ Number(rerankWeight).toFixed(2) }}</span>
                    <span>1（纯向量）</span>
                  </div>
                </div>
                <div class="num-block">
                  <div class="fb-label">初检候选数</div>
                  <input type="number" min="5" max="50" v-model="rerankCandidates" class="fb-number">
                  <div class="fb-desc">建议 10~30</div>
                </div>
              </div>
            </div>
            <div class="panel">
              <div class="form-row">
                <div class="fr-info">
                  <div class="fr-name">混合检索（Hybrid Search）</div>
                  <div class="fr-desc">同时做向量语义检索和 BM25 关键词检索，分数归一化后按权重融合。</div>
                </div>
                <label class="toggle"><input type="checkbox" v-model="hybridEnabled"><span class="slider"></span></label>
              </div>
              <div v-if="hybridEnabled" class="form-sub">
                <div class="range-block">
                  <div class="fb-label">向量分数权重</div>
                  <input type="range" min="0" max="1" step="0.05" v-model="hybridWeight" class="fb-range">
                  <div class="range-meta">
                    <span>0（纯BM25）</span>
                    <span class="range-val">{{ Number(hybridWeight).toFixed(2) }}</span>
                    <span>1（纯向量）</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- 快捷回复 -->
          <div v-show="setTab === 'reply'">
            <div class="panel">
              <div class="form-row">
                <div class="fr-info">
                  <div class="fr-name">FAQ 快捷回复</div>
                  <div class="fr-desc">用户问题与 FAQ 库相似度超过阈值时，直接回复预设答案，不调用大模型，毫秒级响应。</div>
                </div>
                <label class="toggle"><input type="checkbox" v-model="faqEnabled"><span class="slider"></span></label>
              </div>
              <div v-if="faqEnabled" class="form-sub">
                <div class="range-block">
                  <div class="fb-label">匹配阈值</div>
                  <input type="range" min="0.3" max="0.9" step="0.05" v-model="faqThreshold" class="fb-range">
                  <div class="range-meta">
                    <span>0.3（宽松）</span>
                    <span class="range-val">{{ Number(faqThreshold).toFixed(2) }}</span>
                    <span>0.9（严格）</span>
                  </div>
                </div>
              </div>
            </div>
            <div class="panel">
              <div class="form-row">
                <div class="fr-info">
                  <div class="fr-name">意图识别</div>
                  <div class="fr-desc">命中关键词规则时自动执行动作（固定回复/创建工单/转人工），在知识库页管理规则。</div>
                </div>
                <label class="toggle"><input type="checkbox" v-model="intentEnabled"><span class="slider"></span></label>
              </div>
            </div>
          </div>

          <!-- 数据存储 -->
          <div v-show="setTab === 'storage'">
            <div class="panel">
              <div class="form-block">
                <div class="fb-label">当前数据目录</div>
                <div style="font-size:13px;color:var(--text);padding:8px 12px;background:var(--bg-soft);border-radius:6px;word-break:break-all;">{{ dataDir || '加载中...' }}</div>
                <div class="fb-desc">聊天记录、知识库向量、上传文档、图片等全部数据都保存在此目录。默认：{{ defaultDir }}</div>
              </div>
            </div>
            <div class="panel">
              <div class="form-block">
                <div class="fb-label">迁移数据目录 <span class="fb-tag">迁移后需重启服务生效</span></div>
                <input class="form-input" style="width:100%;box-sizing:border-box;" v-model="newDataDir" placeholder="例如 D:\rag-data 或 F:\rag-BOT\data2">
                <div class="fb-desc">会将当前目录中的全部数据复制到新目录（原数据保留不删除），复制完成后请重启服务切换到新目录。</div>

                  <button class="btn-primary" :disabled="migrating || !newDataDir.trim()" @click="migrateData">{{ migrating ? '迁移中...' : '📦 迁移到此目录' }}</button>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
