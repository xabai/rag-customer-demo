  <!-- 数据看板视图 -->
  <script type="text/x-template" id="tpl-dashboard-view">
    <div id="dashboard-view" class="main-view" style="overflow-y:auto;">
      <div class="dash-page">
        <!-- 左侧二级子菜单 -->
        <div class="dash-subnav">
          <div v-for="t in tabs" :class="['ds-item', { active: dashTab === t.key }]" @click="switchTab(t.key)">
            <span>{{ t.icon }}</span><span>{{ t.label }}</span>
          </div>
          <div class="ds-foot">
            <div style="font-size:12px;color:var(--text-dim);">文档 {{ stats ? stats.documents : 0 }} 篇</div>
            <div style="font-size:12px;color:var(--text-dim);">分块 {{ stats ? stats.chunks : 0 }} 条</div>
          </div>
        </div>
        <!-- 右侧内容 -->
        <div class="dash-content">
          <!-- 概览 -->
          <div v-show="dashTab === 'overview'">
            <div class="dash-section-title">核心指标</div>
            <div id="dash-cards" class="dash-grid">
              <div class="dash-card" v-for="c in cards" :key="c.label">
                <div class="icon" :style="{ background: c.bg, color: c.color }">{{ c.icon }}</div>
                <div><div class="num">{{ c.num }}</div><div class="label">{{ c.label }}</div></div>
              </div>
            </div>
            <div class="dash-section-title">满意度概览</div>
            <div class="panel">
              <div v-if="satisRate === null" class="empty-tip">暂无反馈数据</div>
              <div v-else style="display:flex;align-items:center;gap:12px;">
                <div style="flex:1;height:10px;background:var(--bg-soft);border-radius:99px;overflow:hidden;">
                  <div :style="{ width: satisRate + '%' }" style="height:100%;background:linear-gradient(90deg,#22c55e,#4ade80);border-radius:99px;"></div>
                </div>
                <span style="font-size:16px;font-weight:700;color:#16a34a;">{{ satisRate }}%</span>
                <span style="font-size:13px;color:var(--text-sub);">满意（{{ fbTotal }} 条反馈）</span>
              </div>
            </div>
          </div>

          <!-- 趋势分析 -->
          <div v-show="dashTab === 'trend'">
            <div class="dash-toolbar">
              <span class="dash-section-title" style="margin:0;">趋势分析</span>
              <div class="seg">
                <button v-for="d in dayOptions" :class="{active: days===d}" @click="changeDays(d)">{{ d }}天</button>
              </div>
            </div>
            <div class="chart-title">每日问答量</div>
            <div class="panel" ref="barBox">
              <svg v-if="trend" :viewBox="barViewBox" preserveAspectRatio="none" style="width:100%;height:240px;">
                <g v-for="(p, i) in barBars" :key="'g'+i">
                  <rect :x="p.x" :y="p.y" :width="p.w" :height="p.h" rx="3" :fill="barFill" />
                  <text :x="p.x+p.w/2" :y="p.y-4" text-anchor="middle" font-size="11" fill="var(--text-sub)">{{ p.v }}</text>
                  <text :x="p.x+p.w/2" :y="232" text-anchor="middle" font-size="10" fill="var(--text-dim)">{{ p.label }}</text>
                </g>
              </svg>
              <div v-else class="empty-tip">加载中...</div>
            </div>
            <div class="chart-title">每日反馈趋势（点赞 / 点踩）</div>
            <div class="panel">
              <svg v-if="trend" :viewBox="lineViewBox" preserveAspectRatio="none" style="width:100%;height:220px;">
                <polyline :points="lineLikes" fill="none" stroke="#22c55e" stroke-width="2" />
                <polyline :points="lineDislikes" fill="none" stroke="#ef4444" stroke-width="2" />
                <g v-for="(p, i) in linePoints" :key="'lp'+i">
                  <circle :cx="p.lx" :cy="p.ly" r="3" fill="#22c55e" />
                  <circle :cx="p.dx" :cy="p.dy" r="3" fill="#ef4444" />
                </g>
              </svg>
              <div style="display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--text-sub);">
                <span><i style="display:inline-block;width:12px;height:3px;background:#22c55e;vertical-align:middle;margin-right:4px;"></i>点赞</span>
                <span><i style="display:inline-block;width:12px;height:3px;background:#ef4444;vertical-align:middle;margin-right:4px;"></i>点踩</span>
              </div>
            </div>
          </div>

          <!-- 分布占比 -->
          <div v-show="dashTab === 'distribution'">
            <div class="dash-section-title">分布占比</div>
            <div class="dash-grid" style="grid-template-columns:1fr 1fr;">
              <div class="panel">
                <div class="chart-title">反馈赞踩占比</div>
                <div style="display:flex;align-items:center;gap:20px;">
                  <svg viewBox="0 0 100 100" style="width:160px;height:160px;">
                    <circle v-if="pieTotal===0" cx="50" cy="50" r="40" fill="none" stroke="var(--bg-soft)" stroke-width="14"/>
                    <g v-else>
                      <path :d="pieLikePath" fill="#22c55e"/>
                      <path :d="pieDislikePath" fill="#ef4444"/>
                    </g>
                  </svg>
                  <div style="font-size:13px;line-height:2;">
                    <div><span style="color:#22c55e;">■</span> 点赞 {{ pieLikes }} ({{ pieLikePct }}%)</div>
                    <div><span style="color:#ef4444;">■</span> 点踩 {{ pieDislikes }} ({{ pieDislikePct }}%)</div>
                  </div>
                </div>
              </div>
              <div class="panel">
                <div class="chart-title">问答来源分布</div>
                <div style="display:flex;align-items:center;gap:20px;">

  <!-- 自定义确认框 -->
  <script type="text/x-template" id="tpl-confirm-modal">

        <div id="confirm-btns">
          <button id="confirm-cancel" @click="store.resolveConfirm(false)">取消</button>
          <button id="confirm-ok" @click="store.resolveConfirm(true)">{{ store.confirmOkText }}</button>
        </div>
      </div>
    </div>
  </script>

  <!-- Toast 提示 -->
  <script type="text/x-template" id="tpl-toast-box">
    <div id="toast" :class="{ show: store.toastShow }">{{ store.toastText }}</div>
  </script>

  <script src="/static/vendor/vue.global.prod.js"></script>
  <script>
  /* ================================================================
   * 系统设置默认值（与后端 core/settings.py DEFAULT_SETTINGS 保持一致）
   * ================================================================ */
  const DEFAULT_SETTINGS = {
    kb_prompt: "你是一名严格遵循资料的 AI 客服。\n必须严格遵守以下规则：\n1. 只能基于【知识库资料】中的内容回答用户问题，绝不使用你自己的知识；\n2. 答案必须逐条引用资料原文，不允许概括、推测或补充资料之外的信息；\n3. 如果资料中没有相关信息，只回答\"抱歉，当前资料中未提及该问题，请联系人工客服或补充资料\"；\n4. 不要在回答中提及\"知识库资料\"\"参考资料\"\"根据资料\"等字眼，直接给出答案；\n5. 回答简洁，不要有多余开场白或结尾语。\n\n【知识库资料】\n{context}",
    no_match_prompt: "你是一名 AI 客服。当前知识库中没有与用户问题相关的资料。\n你只能回复：\"抱歉，当前资料中未提及该问题，请联系人工客服或补充资料。\"\n禁止使用你自身的知识回答，不要编造任何信息。",
    direct_prompt: "你是一名专业、热情的 AI 客服助手。请直接、准确地回答用户的问题，回答简洁清晰，可分点说明。\n注意：用户已关闭知识库检索，请完全基于自身知识回答，不要引用历史对话中出现的任何知识库资料或参考来源内容。",
    sensitive_words: "暴力\n赌博\n诈骗\n色情\n枪支\n毒品",
    rerank_enabled: true,
    rewrite_enabled: true,
    rerank_vector_weight: 0.7,
    rerank_candidates: 20,
    hybrid_enabled: false,
    hybrid_vector_weight: 0.6,
    faq_enabled: true,
    faq_threshold: 0.6,
    intent_enabled: true
  };

  /* ================================================================
   * 全局响应式 Store：会话、消息、知识库列表、Toast、确认框
   * ================================================================ */
  const store = Vue.reactive({
    // 当前视图: chat | kb | dashboard | memory | settings
    view: 'chat',

    /* ---- Toast ---- */
    toastText: '', toastShow: false, _toastTimer: null,
    toast(text) {
      this.toastText = text;
      this.toastShow = true;
      clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(() => { this.toastShow = false; }, 2500);
    },

    /* ---- 自定义确认框（Promise 化，okText 可自定义按钮文案） ---- */
    confirmShow: false, confirmText: '', confirmOkText: '确认', _confirmResolve: null,
    confirm(text, okText) {
      return new Promise(resolve => {
        this.confirmText = text;
        this.confirmOkText = okText || '确认';
        this.confirmShow = true;
        this._confirmResolve = resolve;
      });
    },
    resolveConfirm(val) {
      this.confirmShow = false;
      if (this._confirmResolve) { this._confirmResolve(val); this._confirmResolve = null; }
    },

    /* ---- 知识库分组列表（供各下拉框共用） ---- */
    kbList: [],
    async loadKbList() {
      try { this.kbList = await (await fetch('/api/kb')).json(); }
      catch (e) { console.error(e); }
    },

    /* ---- 知识库统计 ---- */
    statDocs: 0, statChunks: 0,

    /* ---- 会话与消息 ---- */
    sessions: [],
    currentSession: null,
    currentIsEmpty: false,   // 当前会话是否还没有消息
    messages: [],            // { role, content, sources?, images?, toolCall?, slowTip? }
    // 每个会话的本地消息缓存（key=sessionId），用于恢复"思考中"的流式状态
    // 后端只在完成后存一条消息，流式中的 content=null 消息不会持久化
    _sessionBuffer: {},
    _abortCtrl: null,  // 当前请求的 AbortController
    _sending: false,   // 当前是否正在流式生成

    get sending() { return !!this._sending; },

    /* 切换会话：先把当前正在流式生成的状态暂存，切回来再恢复 */
    _bufferCurrentSession() {
      if (!this.currentSession) return;
      this._sessionBuffer[this.currentSession] = {
        messages: JSON.parse(JSON.stringify(this.messages)),
        sending: this._sending,
      };
    },
    _restoreSessionBuffer(id) {
      const buf = this._sessionBuffer[id];
      if (buf) {
        this.messages = buf.messages;
        // 注意：buf.sending 为 true 表示正在流式生成，切回来时后端请求其实已中断，
        // 所以需要去掉 sending 状态并标记消息为已完成状态（content=null 的改个文案）
        return true;
      }
      return false;
    },

    async loadSessions() {
      const list = await (await fetch('/api/sessions')).json();
      this.sessions = list;
    },

    async newSession() {
      // 当前已是空会话则直接清屏复用，避免堆积空"新对话"
      if (this.currentSession && this.currentIsEmpty) { this.messages = []; return; }
      const s = await (await fetch('/api/sessions', { method: 'POST' })).json();
      this.currentSession = s.id;
      this.currentIsEmpty = true;
      await this.loadSessions();
      this.messages = [];
    },

    async switchSession(id) {
      // ① 先把当前会话暂存到本地 buffer
      //    直接存数组引用（不深拷贝！）—— send() 里闭包 msg 引用会持续更新，
      //    buffer 里的数组就是同一个，所以流式 token 会自动反映到 buffer 里
      if (this.currentSession) {
        this._sessionBuffer[this.currentSession] = this.messages;
      }
      this.currentSession = id;

      // ② 优先从本地 buffer 恢复（保住思考中的消息）
      if (this._sessionBuffer[id]) {
        this.messages = this._sessionBuffer[id];
        this.currentIsEmpty = this.messages.length === 0;
        return;
      }

      // 无 buffer → 从后端加载
      try {
        const resp = await fetch(`/api/sessions/${id}/messages`);
        if (!resp.ok) throw new Error('接口 ' + resp.status);
        const msgs = await resp.json();
        this.currentIsEmpty = !Array.isArray(msgs) || msgs.length === 0;
        this.messages = Array.isArray(msgs) ? msgs.map(m => ({ role: m.role, content: m.content, images: m.images || null, sources: m.sources || null })) : [];
      } catch (e) {
        console.error('切换会话失败:', e);
      }
    },

    async deleteSession(id) {
      const ok = await this.confirm('确认删除该对话？删除后无法恢复。', '确认删除');
      if (!ok) return;
      await fetch(`/api/sessions/${id}`, { method: 'DELETE' });
      if (id === this.currentSession) { this.currentSession = null; this.currentIsEmpty = true; this.messages = []; }
      await this.loadSessions();
    }
  });

      speakAnswer(text) {

          iframe.contentWindow.postMessage({ type: 'set_voice', voice: this.avatarVoice }, '*');
          iframe.contentWindow.postMessage({ type: 'set_asset', asset: this.avatarAsset }, '*');
        }
      },

      /* ---- 发送（SSE 流式解析） ---- */
      async send(regenerateText) {
        const text = regenerateText || this.inputText.trim();
        const imgs = regenerateText ? [] : [...this.pendingImages];
        if ((!text && !imgs.length) || this.sending) return;
        if (!store.currentSession) await store.newSession();

        this.stopSpeaking(); // 新提问立即打断数字人播报
        this.sending = true;
        this.abortCtrl = new AbortController();
        if (!regenerateText) { this.inputText = ''; this.pendingImages = []; }
        store.currentIsEmpty = false;
        if (!regenerateText) {
          store.messages.push({ role: 'user', content: text || '（图片提问）', images: imgs.length ? imgs : null });
        }
        store.messages.push({ role: 'assistant', content: null, toolCall: null, slowTip: false, sources: null, stage: null, totalMs: null, traceId: null });
        // 取响应式代理引用，后续逐 token 追加即自动刷新 DOM
        const msg = store.messages[store.messages.length - 1];
        // 记录当前会话 id，后续 token 只在"用户没切走"时才触发 scrollBottom
        const _sendSessionId = store.currentSession;

        let firstToken = true;
        const slowTimer = setTimeout(() => { if (firstToken) msg.slowTip = true; }, 6000);

        try {
          const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: this.abortCtrl.signal,
            body: JSON.stringify({
              session_id: store.currentSession,
              message: text || '请描述这张图片',
              model: this.model,
              use_kb: this.useKb,
              kb_id: this.kbId || '',
              use_tools: this.useTools,
              enabled_tools: this.useTools ? this.enabledTools : null,
              images: imgs
            })
          });
          if (!resp.ok) throw new Error('接口错误 ' + resp.status);
          const reader = resp.body.getReader();
          const decoder = new TextDecoder();
          let buf = '';
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const lines = buf.split('\n');
            buf = lines.pop();
            for (const line of lines) {
              if (!line.startsWith('data: ')) continue;
              const data = JSON.parse(line.slice(6));
              if (data.type === 'stage') {
                // 阶段提示：检索中/生成中（首 token 到达后自动消失）
                msg.stage = { content: data.content, elapsed_ms: data.elapsed_ms };
              } else if (data.type === 'tool') {
                // 工具调用提示（只展示第一次）
                if (!msg.toolCall) msg.toolCall = `🛠 调用工具: ${data.tool}(${JSON.stringify(data.args)})`;
              } else if (data.type === 'token') {
                if (firstToken) { firstToken = false; clearTimeout(slowTimer); msg.slowTip = false; msg.stage = null; msg.content = ''; }
                msg.content += data.content;
                if (store.currentSession === _sendSessionId) this.scrollBottom();  // 只在当前会话时滚屏
              } else if (data.type === 'replace') {
                if (firstToken) { firstToken = false; clearTimeout(slowTimer); msg.slowTip = false; msg.stage = null; }
                msg.content = data.content;
              } else if (data.type === 'done') {
                msg.stage = null;
                msg.totalMs = data.total_ms || null;
                msg.traceId = data.trace_id || null;
                if (firstToken) { firstToken = false; clearTimeout(slowTimer); msg.slowTip = false; msg.content = '（模型没有返回内容）'; }
                if (data.sources && data.sources.length) msg.sources = data.sources;
                this.speakAnswer(msg.content); // 数字人口播：回答完成后同步语音播报
              } else if (data.type === 'error') {
                msg.stage = null;
                if (firstToken) { firstToken = false; clearTimeout(slowTimer); msg.slowTip = false; }
                msg.content = '出错了: ' + data.content;
              }
            }
          }
          store.loadSessions();
        } catch (e) {
          msg.stage = null;
          if (e.name === 'AbortError') {
            msg.content = (msg.content || '') + '\n（已中断）';
          } else {
            if (firstToken) { clearTimeout(slowTimer); msg.slowTip = false; }
            msg.content = '请求失败: ' + e.message;
          }
        }
        this.sending = false;
        this.abortCtrl = null;
        this.$nextTick(() => { if (this.$refs.inputEl) this.$refs.inputEl.focus(); });
      },

      stop() { if (this.abortCtrl) this.abortCtrl.abort(); },

      /* ---- 消息操作栏 ---- */
      copyMsg(m) {
        if (navigator.clipboard) navigator.clipboard.writeText(m.content || '');

      },
      regen(m) { this.send(m.content); },

      /* ---- 召回图片点击 → 灯箱放大（用 URL 直接引用） ---- */
      previewSrcImg(url) {

      },

      /* ---- 引用跳转：查看命中分块原文 ---- */
      async jumpToSource(s) {
        if (!s.doc_id) { store.toast('该来源不支持跳转'); return; }
        try {
          const chunks = await (await fetch(`/api/documents/${s.doc_id}/chunks`)).json();
          const hit = chunks.find(c => c.index === s.chunk_index);
          this.chunkView = {
            doc: s.doc, score: s.score,
            index: s.chunk_index,
            text: hit ? hit.text : '（分块内容获取失败）',
            hasImage: s.has_image,
          };
        } catch (e) { store.toast('获取分块失败: ' + e.message); }
      },
      async exportSession() {
        if (!store.currentSession) { store.toast('请先选择一个会话'); return; }
        const s = store.sessions.find(x => x.id === store.currentSession);
        const title = s ? s.title : store.currentSession;
        if (!await store.confirm(`将导出对话「${title}」为 Markdown 文件，确认导出？`, '导出')) return;
        window.open(`/api/sessions/${store.currentSession}/export`, '_blank');
      },

      async feedback(rating) {
        if (!store.currentSession) return;
        store.toast('感谢反馈');
        try {
          await fetch('/api/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: store.currentSession, message_id: 0, rating })
          });
        } catch (e) { console.error(e); }
      },

      /* ---- 多模态：图片压缩与预览 ---- */
      compressImage(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = e => {
            const img = new Image();
            img.onload = () => {
              const maxSide = 1024;
              let { width, height } = img;
              if (Math.max(width, height) > maxSide) {
                const scale = maxSide / Math.max(width, height);
                width = Math.round(width * scale);
                height = Math.round(height * scale);
              }
              const canvas = document.createElement('canvas');
              canvas.width = width; canvas.height = height;
              canvas.getContext('2d').drawImage(img, 0, 0, width, height);
              const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
              resolve(dataUrl.split(',')[1]);  // 去掉 data:image/jpeg;base64, 前缀
            };
            img.onerror = reject;
            img.src = e.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      },
      async onImgChange(e) {
        for (const file of e.target.files) {
          if (this.pendingImages.length >= 4) { store.toast('最多同时上传 4 张图片'); break; }
          try {
            const b64 = await this.compressImage(file);
            this.pendingImages.push(b64);
          } catch { store.toast('图片读取失败：' + file.name); }
        }
        e.target.value = '';
      },

      /* ---- 链路追踪 ---- */
      async viewTrace(traceId) {
        try {
          const trace = await (await fetch(`/api/traces/${traceId}`)).json();
          if (trace.error) { store.toast('链路记录不存在'); return; }
          let detail = `trace_id: ${trace.trace_id}\n`;
          detail += `问题: ${trace.question}\n`;
          detail += `总耗时: ${(trace.total_ms/1000).toFixed(1)}s\n\n`;
          trace.stages.forEach((s, i) => {
            const icon = s.status === 'pass' ? '✅' : s.status === 'hit' ? '🎯' : s.status === 'error' ? '❌' : '⏭️';
            detail += `${icon} ${s.name} | ${(s.elapsed_ms/1000).toFixed(1)}s\n`;
            if (s.error) detail += `   错误: ${s.error}\n`;
          });
          store.toast(detail, 8000);
        } catch (e) { store.toast('获取链路失败: ' + e.message); }
      }
    }
  });

  /* ================================================================

  app.component('kb-view', {
    template: '#tpl-kb-view',

      async delDoc(d) {

        await fetch(`/api/documents/${d.id}`, { method: 'DELETE' });
        this.loadDocs();
      },

      /* ---- 上传流程 ---- */
      openUploadModal(files) {
        this.pendingFiles = [...files];
        this.showUploadModal = true;
      },
      closeUploadModal() {
        this.showUploadModal = false;
        this.pendingFiles = [];

      onFilePick(e) {

      onDrop(e) {

      async handleUpload(p) {
        if (p.mode === 'url') {
          this.urlFetching = true;
          try {
            const resp = await fetch('/api/upload_url', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                url: p.url,
                kb_id: p.kbId || 'default',
                chunk_size: p.chunkSize,
                chunk_overlap: p.chunkOverlap,
                chunk_mode: p.chunkMode
              })
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.detail || '未知错误');
            store.toast(`网页已入库：${data.chunks} 块`);
            this.showUploadModal = false;
            this.loadDocs();
          } catch (err) {
            store.toast('URL 导入失败：' + err.message);
          } finally {
            this.urlFetching = false;
          }
          return;
        }
        this.showUploadModal = false;
        await this.uploadFiles(p.files, p);
        this.pendingFiles = [];
      },

      async uploadFiles(files, opts) {
        files = [...files];
        if (!files.length || this.uploading) return;
        this.uploading = true;
        let ok = 0, fail = 0;
        const IMG_EXT = ['.jpg', '.jpeg', '.png', '.gif', '.webp', '.bmp'];
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const isImg = IMG_EXT.includes(file.name.slice(file.name.lastIndexOf('.')).toLowerCase());
          this.uploadStatus = `上传中 (${i + 1}/${files.length}): ${file.name} …${isImg ? '（图片知识库：视觉模型解析中，稍慢）' : ''}`;
          const fd = new FormData();
          fd.append('file', file);
          fd.append('kb_id', opts.kbId || 'default');
          try {
            let resp;
            if (isImg) {
              // 图片知识库：视觉模型生成描述后入库
              resp = await fetch('/api/upload_image', { method: 'POST', body: fd });
            } else {
              fd.append('chunk_size', opts.chunkSize);
              fd.append('chunk_overlap', opts.chunkOverlap);
              fd.append('chunk_mode', opts.chunkMode);
              resp = await fetch('/api/upload', { method: 'POST', body: fd });
            }
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.detail || '未知错误');
            ok++;
            this.uploadStatus = isImg ? `图片已入库：${file.name}` : `已解析 ${file.name}（${data.chunks} 块）`;
          } catch (err) {
            fail++;
            alert(`「${file.name}」上传失败: ${err.message}`);
          }
          this.loadDocs();
        }
        this.uploadStatus = `完成：成功 ${ok} 个` + (fail ? `，失败 ${fail} 个` : '');
        this.uploading = false;
        setTimeout(() => { this.uploadStatus = ''; }, 6000);
      },

      /* ---- 新建知识库 ---- */
      async createKb({ name, desc }) {
        await fetch('/api/kb', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, description: desc })
        });
        this.showKbModal = false;
        await store.loadKbList();
        store.toast('知识库已创建');
      },

      /* ---- 待补充问题 ---- */
      async loadUnanswered() {
        try {
          this.unanswered = await (await fetch('/api/unanswered')).json();
        } catch (e) { console.error('加载待补充问题失败:', e); }
      },
      async delUnanswered(item) {
        await fetch(`/api/unanswered/${item.id}`, { method: 'DELETE' });
        this.loadUnanswered();
      },

      /* ---- FAQ ---- */
      async loadFaq() {
        this.faqs = await (await fetch('/api/faq')).json();
      },
      async addFaq() {
        const q = this.faqQ.trim();
        const a = this.faqA.trim();
        if (!q || !a) { store.toast('问题和答案都不能为空'); return; }
        await fetch('/api/faq', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q, answer: a })
        });
        this.faqQ = '';
        this.faqA = '';
        this.loadFaq();
      },
      async delFaq(item) {
        await fetch(`/api/faq/${item.id}`, { method: 'DELETE' });
        this.loadFaq();
      },

      /* ---- 意图规则 ---- */
      async loadIntentRules() {
        this.rules = await (await fetch('/api/intent-rules')).json();
      },
      async addRule() {
        const name = this.irName.trim();
        const keywords = this.irKeywords.trim();
        if (!name || !keywords) { store.toast('意图名称和关键词不能为空'); return; }
        await fetch('/api/intent-rules', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, keywords, action: this.irAction, reply: this.irReply.trim() })
        });
        this.irName = '';
        this.irKeywords = '';
        this.irReply = '';
        this.loadIntentRules();
      },
      async toggleRule(r) {
        await fetch(`/api/intent-rules/${r.id}/toggle`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enabled: !r.enabled })
        });
        this.loadIntentRules();
      },
      async delRule(r) {
        if (!await store.confirm(`确认删除规则「${r.name}」？`, '确认删除')) return;
        await fetch(`/api/intent-rules/${r.id}`, { method: 'DELETE' });
        this.loadIntentRules();
      },

      /* ---- 工单 ---- */
      async loadTickets() {
        this.tickets = await (await fetch('/api/tickets')).json();
      },
      async toggleTicket(t) {
        await fetch(`/api/tickets/${t.id}/status`, {

    }),

      },

      satisRate() {
        if (!this.stats) return null;
        const total = this.stats.likes + this.stats.dislikes;

      },
      /* ---- 柱形图：每日问答量 ---- */
      barFill() { return 'var(--accent)'; },
      barViewBox() { return '0 0 600 240'; },
      barBars() {
        const data = (this.trend && this.trend.daily_qa) || [];
        if (!data.length) return [];
        const max = Math.max(...data.map(d => d.count), 1);
        const W = 600, H = 220, pad = 10;
        const bw = (W - pad * 2) / data.length * 0.6;
        const gap = (W - pad * 2) / data.length;
        return data.map((d, i) => {
          const h = (d.count / max) * (H - 30);
          return {
            x: pad + i * gap + (gap - bw) / 2,
            y: H - h,
            w: bw, h: h,
            v: d.count,
            label: d.date.slice(5)
          };
        });
      },
      /* ---- 折线图：每日反馈 ---- */
      lineViewBox() { return '0 0 600 220'; },
      linePoints() {
        const data = (this.trend && this.trend.daily_feedback) || [];
        if (!data.length) return [];
        const max = Math.max(...data.flatMap(d => [d.likes, d.dislikes]), 1);
        const W = 600, H = 200, pad = 10;
        const step = (W - pad * 2) / Math.max(data.length - 1, 1);
        return data.map((d, i) => ({
          lx: pad + i * step, ly: H - (d.likes / max) * (H - 20),
          dx: pad + i * step, dy: H - (d.dislikes / max) * (H - 20)
        }));
      },
      lineLikes() { return this.linePoints.map(p => `${p.lx},${p.ly}`).join(' '); },
      lineDislikes() { return this.linePoints.map(p => `${p.dx},${p.dy}`).join(' '); },
      /* ---- 饼图：赞踩占比 ---- */
      pieLikes() { return this.stats ? this.stats.likes : 0; },
      pieDislikes() { return this.stats ? this.stats.dislikes : 0; },
      pieTotal() { return this.pieLikes + this.pieDislikes; },
      pieLikePct() { return this.pieTotal ? Math.round(this.pieLikes / this.pieTotal * 100) : 0; },
      pieDislikePct() { return this.pieTotal ? 100 - this.pieLikePct : 0; },
      pieLikePath() {
        if (this.pieTotal === 0) return '';
        const frac = this.pieLikes / this.pieTotal;
        const a = frac * Math.PI * 2;
        const cx = 50, cy = 50, r = 40;
        const x = cx + r * Math.sin(a), y = cy - r * Math.cos(a);
        const large = frac > 0.5 ? 1 : 0;
        if (frac >= 1) return `M ${cx} ${cy-r} A ${r} ${r} 0 1 1 ${cx-.01} ${cy-r} Z`;
        return `M ${cx} ${cy} L ${cx} ${cy-r} A ${r} ${r} 0 ${large} 1 ${x} ${y} Z`;
      },
      pieDislikePath() {
        if (this.pieTotal === 0) return '';
        const frac = this.pieLikes / this.pieTotal;
        if (frac >= 1) return '';
        const a1 = frac * Math.PI * 2;
        const a2 = Math.PI * 2;
        const cx = 50, cy = 50, r = 40;
        const x1 = cx + r * Math.sin(a1), y1 = cy - r * Math.cos(a1);
        const x2 = cx + r * Math.sin(a2), y2 = cy - r * Math.cos(a2);
        const df = 1 - frac;
        const large = df > 0.5 ? 1 : 0;
        return `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`;
      },
      /* ---- 环形图：问答来源分布 ---- */
      sourceData() {
        const raw = (this.trend && this.trend.qa_source) || [];
        const colors = ['#0ea5e9', '#22c55e', '#f59e0b'];
        const total = raw.reduce((s, x) => s + x.value, 0) || 1;
        return raw.map((x, i) => ({
          ...x, color: colors[i], pct: Math.round(x.value / total * 100)
        }));
      },
      donutTotal() { return this.sourceData.reduce((s, x) => s + x.value, 0); },
      donutFAQ() {
        const t = this.donutTotal || 1;
        const v = this.sourceData[0] ? this.sourceData[0].value : 0;
        return (v / t) * 251.2;
      },
      donutKB() {
        const t = this.donutTotal || 1;
        const v = this.sourceData[1] ? this.sourceData[1].value : 0;
        return (v / t) * 251.2;
      },
      donutNM() {
        const t = this.donutTotal || 1;
        const v = this.sourceData[2] ? this.sourceData[2].value : 0;
        return (v / t) * 251.2;
      },
      /* ---- 耗时分布柱形图 ---- */
      latViewBox() { return '0 0 400 200'; },
      latBars() {
        const lat = (this.trend && this.trend.latency) || { avg: 0, p50: 0, p90: 0, p95: 0 };
        const items = [
          { label: '平均', v: lat.avg, color: '#0ea5e9' },
          { label: 'P50', v: lat.p50, color: '#22c55e' },
          { label: 'P90', v: lat.p90, color: '#f59e0b' },
          { label: 'P95', v: lat.p95, color: '#ef4444' }
        ];
        const max = Math.max(...items.map(i => i.v), 1);
        const W = 400, H = 180, pad = 10;
        const bw = (W - pad * 2) / items.length * 0.55;
        const gap = (W - pad * 2) / items.length;
        return items.map((it, i) => {
          const h = (it.v / max) * (H - 30);
          return {
            x: pad + i * gap + (gap - bw) / 2,
            y: H - h,
            w: bw, h: h,
            v: it.v, label: it.label, color: it.color
          };
        });
      }
    },
    methods: {
      fmtTs(ts) { return new Date(ts * 1000).toLocaleString(); },
      switchTab(k) {
        this.dashTab = k;
        if (k === 'eval') this.loadEval();
        if (k === 'health') this.loadHealth();
        if (k === 'trace') this.loadTraces();
      },
      async changeDays(d) {
        this.days = d;
        await this.loadTrend();
      },
      async load() {
        const s = await (await fetch('/api/stats')).json();
        this.stats = s;
        this.feedbackList = await (await fetch('/api/feedback')).json();
        this.qaLog = await (await fetch('/api/qa_log?limit=50')).json();
        this.loadTrend();
      },
      async loadTrend() {
        try {
          this.trend = await (await fetch(`/api/stats/trend?days=${this.days}`, { cache: 'no-store' })).json();
        } catch (e) { console.error(e); }
      },
      exportBadcase() {
        const a = document.createElement('a');
        a.href = '/api/qa_log/export';
        a.download = `badcases_${new Date().toISOString().slice(0, 10)}.jsonl`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      },
      /* ---- 评测集 ---- */
      async loadEval() {
        try { this.evalCases = await (await fetch('/api/eval/cases')).json(); }
        catch (e) { console.error(e); }
      },
      async addEvalCase() {
        if (!this.newEvalQ.trim() || !this.newEvalA.trim()) { store.toast('请填写问题和期望答案'); return; }
        await fetch('/api/eval/cases', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: this.newEvalQ, expected: this.newEvalA })
        });
        this.newEvalQ = ''; this.newEvalA = '';
        this.loadEval();
        store.toast('已加入评测集');
      },
      async delEvalCase(id) {
        await fetch(`/api/eval/cases/${id}`, { method: 'DELETE' });
        this.loadEval();
      },
      /* 问答日志一键加入评测集 */
      async addToEval(log) {
        await fetch('/api/eval/cases/from_log', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: log.question, expected: log.answer, kb_id: log.kb_id || '' })
        });
        store.toast('已加入评测集，可到「评测集」页签修改期望答案');
      },
      async runEval() {
        this.evalRunning = true; this.evalReport = null;
        try {
          this.evalReport = await (await fetch('/api/eval/run', { method: 'POST' })).json();
        } catch (e) { store.toast('评测失败: ' + e.message); }
        this.evalRunning = false;
      },
      /* ---- 知识库健康度 ---- */
      async loadHealth() {
        try { this.kbHealth = await (await fetch('/api/kb/health')).json(); }
        catch (e) { console.error(e); }
      },
      /* ---- 链路追踪 ---- */
      async loadTraces() {
        try { this.traceList = await (await fetch('/api/traces?limit=50')).json(); }
        catch (e) { console.error(e); }
      },
      async viewTraceDetail(traceId) {
        try {
          this.traceDetail = await (await fetch(`/api/traces/${traceId}`)).json();
        } catch (e) { store.toast('获取链路详情失败: ' + e.message); }
      }
    }
  });

  /* ================================================================
   * 长期记忆视图
   * ================================================================ */
  app.component('memory-view', {
    template: '#tpl-memory-view',
    data: () => ({
      store,
      memories: [],
      kindMap: { summary: '📝 会话摘要', preference: '❤️ 用户偏好', fact: '📌 事实信息' }
    }),
    methods: {
      kindLabel(kind) { return this.kindMap[kind] || kind; },
      async load() {
        this.memories = await (await fetch('/api/memories')).json();
      },
      async del(m) {
        await fetch(`/api/memories/${m.id}`, { method: 'DELETE' });
        this.load();
      }
    }
  });

  /* ================================================================
   * 自定义确认框 / Toast
   * ================================================================ */
  app.component('confirm-modal', {
    template: '#tpl-confirm-modal',
    data: () => ({ store })
  });

  app.component('toast-box', {
    template: '#tpl-toast-box',
    data: () => ({ store })
  });

  app.mount('#app');
  </script>
</body>
</html>
