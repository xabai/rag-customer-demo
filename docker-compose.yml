# ====================================================================
# RAG-BOT Docker Compose 编排
#
# 服务：backend + postgres + redis + ollama（可选 GPU）
# 前端：backend 直接 serve static（最简），或加 nginx 反代（生产推荐）
# 数字人：独立部署，不在本 compose 里
#
# 使用：
#   cp .env.example .env     # 按需改配置
#   docker compose up -d    # 启动全部
#   docker compose logs -f backend    # 看日志
#   docker compose pull && docker compose up -d    # 发版更新
# ====================================================================
services:

  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rag_bot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rag_bot_2024}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"     # 宿主机直接连（开发用）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-rag_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rag-net

  # ---------- Redis（session + 限流，启用后比内存 fallback 靠谱）----------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - rag-net

  # ---------- Ollama（GPU 可选，本地模型默认必需）----------
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # GPU 用户解注释下面这行 + docker compose 换成 docker compose (含 GPU 支持)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    volumes:
      - ollama_models:/root/.ollama    # 模型权重持久化（容器重建不丢）
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - rag-net

  # ---------- RAG-BOT 后端 ----------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-bot:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      # --- 基础 ---
      APP_ENV: ${APP_ENV:-prod}
      API_HOST: 0.0.0.0
      API_PORT: 8008
      DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}

      # --- 数据库 ---
      DB_DRIVER: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rag_bot}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-rag_bot_2024}

      # --- Redis ---
      REDIS_URL: redis://redis:6379/0

      # --- Ollama ---
      OLLAMA_HOST: http://ollama:11434
      # 容器内不要改 settings.json 里的 ollama_base，让它用默认值 localhost:11434
      # 除非你 settings.json 已改成 http://ollama:11434

      # --- 安全 ---
      JWT_SECRET: ${JWT_SECRET:-CHANGE-ME-IN-PRODUCTION-GENERATE-A-RANDOM-STRING}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8008,http://localhost}

      # --- LLM Provider（如果用云端模型，把 OLLAMA 行注释掉）---
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      # LLM_PROVIDER: openai_compat
      # LLM_BASE: ${LLM_BASE:-https://api.deepseek.com/v1}
      # LLM_API_KEY: ${LLM_API_KEY:-sk-xxx}
      # CHAT_MODEL: ${CHAT_MODEL:-deepseek-chat}

      # --- 数据目录 ---
      RAG_DATA_DIR: /app/data
    volumes:
      - rag_data:/app/data    # settings.json + uploads + chroma 向量持久化
    ports:
      - "8008:8008"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - rag-net

  # ---------- Nginx（生产推荐入口，可选）----------
  # 用的话 backend.ports 可以注释掉，只暴露 80
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html:ro    # 前端静态 Nginx 直接 serve
    ports:
      - "80:80"
    networks:
      - rag-net

# ---------- 网络 & 卷 ----------
networks:
  rag-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  ollama_models:
  rag_data:
